function saveReceiptAI(){const r=window.__receiptAI||{},shop=(document.querySelector('#rShop')?.value||'').trim(),date=document.querySelector('#rDate')?.value||todayISO(),total=Math.max(0,Math.round(Number(document.querySelector('#rAmt')?.value)||0)),pm=document.querySelector('#rPay')?.value||'cash';if(!total){toast('合計金額を確認してください');return}if(duplicateReceipt(date,total,shop)&&!confirm('同じ日付・金額・店舗のレシートが登録済みです。重複して登録しますか？'))return;let items=(r.items||[]).map((it,i)=>({name:it.name||'商品',amount:Math.max(0,Math.round(Number(document.querySelector(`#riAmt${i}`)?.value)||0)),category:validCat(document.querySelector(`#riCat${i}`)?.value||it.category)})).filter(x=>x.amount>0);const sum=items.reduce((a,b)=>a+b.amount,0);if(!items.length)items=[{name:'レシート合計',amount:total,category:'other'}];else if(sum!==total){const diff=total-sum;if(diff>0)items.push({name:'差額',amount:diff,category:'other'});if(diff<0){toast('商品合計がレシート合計を上回っています');return}}const receiptId=uid(),grouped={};items.forEach(it=>grouped[it.category]=(grouped[it.category]||0)+it.amount);S.receipts.push({id:receiptId,date,merchant:shop,total,items:deep(items),source:'gemini',paymentMethod:pm,createdAt:new Date().toISOString()});Object.entries(grouped).forEach(([category,amount])=>recordExpenseWithPayment({date,amount,category,title:shop||'レシート',shop,receiptId,receiptTotal:total,note:'Geminiレシート分類',paymentMethod:pm}));addHistory('Geminiレシート登録',`${date} ${shop||'店舗不明'} ${yen(total)} / ${paymentLabel(pm)} / 画像破棄済み`);clearReceiptTemp();closeModal();save('レシートを登録し、写真を自動破棄しました')}
function saveReceiptManual(){const a=Math.max(0,Math.round(Number(document.querySelector('#rAmt')?.value)||0)),date=document.querySelector('#rDate')?.value||todayISO(),shop=(document.querySelector('#rShop')?.value||'').trim(),cat=validCat(document.querySelector('#rCat')?.value),pm=document.querySelector('#rPay')?.value||'cash';if(!a){toast('金額を入力してください');return}if(duplicateReceipt(date,a,shop)&&!confirm('同じ日付・金額・店舗のレシートが登録済みです。登録しますか？'))return;const receiptId=uid();S.receipts.push({id:receiptId,date,merchant:shop,total:a,items:[{name:'レシート合計',amount:a,category:cat}],source:'manual',paymentMethod:pm,createdAt:new Date().toISOString()});recordExpenseWithPayment({date,amount:a,category:cat,title:shop||S.categories[cat],shop,receiptId,receiptTotal:a,note:'レシート手入力',paymentMethod:pm});addHistory('レシート登録',`${date} ${shop} ${yen(a)} / ${paymentLabel(pm)} / 画像破棄済み`);clearReceiptTemp();closeModal();save('レシート支出を登録しました')}

function openDay(date){const ev=S.events.filter(e=>e.date===date),tx=displayTxForDate(date),cf=cashflowForDate(date);modal(`<h3>${date}</h3><div class="list">${[...cf,...ev,...tx].length?[...cf.map(e=>`<div class="listItem"><div><b>${escapeHtml(e.title)}</b><div class="meta">資金カレンダー</div></div><div style="text-align:right"><div class="money ${e.paid?'pos':'neg'}">${e.paid?'済 ':'-'}${yen(e.amount)}</div>${!e.paid&&e.subtype==='cardBill'?`<button class="btn small" onclick="confirmCardBill('${e.id}')">引落実績</button>`:''}${!e.paid&&e.subtype==='fixed'?`<button class="btn small" onclick="confirmFixedPayment('${e.id}')">支払実績</button>`:''}</div></div>`),...ev.map(e=>`<div class="listItem"><div><b>${escapeHtml(e.title)}</b><div class="meta">予定 ${e.amount?yen(e.amount):''}${e.completed?' ・ 実績化済み':''}</div></div>${!e.completed?`<button class="btn small" onclick="completeEvent('${e.id}')">実績化</button>`:''}</div>`),...tx.map(t=>`<div class="listItem"><div><b>${escapeHtml(t.title)}</b><div class="meta">${t.receiptId?'レシート':'支出'} ・ ${paymentLabel(S.transactions.find(x=>x.id===t.txId)?.paymentMethod||'cash')}</div></div><div class="money neg">-${yen(t.amount)}</div></div>`)].join(''):'<div class="empty">この日の記録はありません</div>'}</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="openExpense('${date}')">支出追加</button><button class="btn" onclick="openEvent('${date}')">予定追加</button></div>`)}


function openMonthEndUpdate(){const next=nextMonthOf(S.currentMonth),surplus=confirmedSurplusForAuto();modal(`<h3>月末更新</h3><div class="notice">${S.currentMonth}を締め、余剰金を自動振り分けして${next}へ進みます。<br><b>優先順位：今月必要な積立 → 生活防衛資金 → 投資</b><br>42万円未満は投資0%。42万円以上は貯金30% / 投資70%、84万円以上は20% / 80%。</div><div class="card" style="margin-top:12px"><div class="label">現在の自動振り分け対象見込み</div><div class="mid">${yen(surplus)}</div><div class="tiny">実績支出・運用開始前カード請求・安全余白を差し引いた概算</div></div><div class="formGroup"><label>${next}運用分の給料</label><input class="input" id="meSalary" type="number" value="${S.salary}"></div><div class="formGroup"><label>給料入金後の実際の口座残高</label><input class="input" id="meAssets" type="number" value="${S.totalAssets}"></div><div class="actions"><button class="btn primary" onclick="applyMonthEndUpdate()">自動振り分けして次月へ</button><button class="btn ghost" onclick="closeModal()">キャンセル</button></div>`)}

function allocateSurplusAutomatically(amount){let remaining=Math.max(0,Math.floor(amount)),log=[];if(!remaining)return{total:0,log};for(const f of S.funds){if(!remaining)break;const need=Math.min(monthlyFundNeed(f),remaining);if(need>0){f.balance+=need;recordFundContribution(f.id,need);remaining-=need;log.push(`${f.name} ${yen(need)}`)}}if(remaining&&S.defense<420000){const a=Math.min(remaining,420000-S.defense);S.defense+=a;remaining-=a;log.push(`生活防衛資金 ${yen(a)}`)}if(remaining){let savePct=S.defense>=840000?.20:.30,investPct=1-savePct;const invest=Math.floor(remaining*investPct),save=remaining-invest;S.defense+=save;S.investment+=invest;log.push(`貯金 ${yen(save)} / 投資 ${yen(invest)}`)}return{total:amount,log}}
function currentMonthPriorCardDrain(){return S.cardOpeningBills.filter(b=>monthOf(b.date)===S.currentMonth).reduce((a,b)=>a+(Number(b.amount)||0),0)}
function confirmedSurplusForAuto(){const spending=expenseTotal();const prior=currentMonthPriorCardDrain();return Math.max(0,S.salary-spending-prior-S.settings.minReserve)}
function applyMonthEndUpdate(){const pending=eventsInMonth().filter(e=>e.type==='plan'&&!e.completed);const unpaidFixed=fixedDueItems().filter(f=>!f.paid);if((pending.length||unpaidFixed.length)&&!confirm(`未完了予定 ${pending.length}件、未支払固定費 ${unpaidFixed.length}件があります。未確定のまま締めますか？`))return;const next=nextMonthOf(S.currentMonth),newSalary=Math.max(0,Number(document.querySelector('#meSalary')?.value)||0),newAssets=Math.max(0,Number(document.querySelector('#meAssets')?.value)||0);if(!newSalary){toast('給料を入力してください');return}const oldMonth=S.currentMonth;if(!S.monthClosures[oldMonth]){const surplus=confirmedSurplusForAuto(),allocation=allocateSurplusAutomatically(surplus);S.monthClosures[oldMonth]={date:new Date().toISOString(),salary:S.salary,expense:expenseTotal(),saved:surplus,totalAssets:S.totalAssets,defense:S.defense,autoAllocation:allocation.log};addHistory('月末自動振り分け',allocation.log.length?allocation.log.join(' / '):'振り分け余剰なし')}const oldAssets=S.totalAssets;S.currentMonth=next;S.salary=newSalary;S.totalAssets=newAssets;calDate=new Date(next+'-01T00:00:00');S.balanceChecks.unshift({date:new Date().toISOString(),old:oldAssets,new:newAssets,diff:newAssets-oldAssets,note:`${next}運用開始`});addHistory('月末更新',`${oldMonth}→${next} / 給料 ${yen(newSalary)} / 口座 ${yen(newAssets)}`);closeModal();save(`${next}の運用を開始しました`)}
function closeMonth(){if(S.monthClosures[S.currentMonth]){toast('すでに締め済みです');return}const surplus=confirmedSurplusForAuto(),allocation=allocateSurplusAutomatically(surplus);S.monthClosures[S.currentMonth]={date:new Date().toISOString(),salary:S.salary,expense:expenseTotal(),saved:surplus,totalAssets:S.totalAssets,defense:S.defense,autoAllocation:allocation.log};addHistory('月末自動振り分け',allocation.log.length?allocation.log.join(' / '):'振り分け余剰なし');save('月末結果と自動振り分けを保存しました')}

function firstRun(){if(S.started)return;const launch=S.beta?.showLaunchNotice?'<div class="notice" style="margin-bottom:10px">🎉 BETA終了。設定と開始前カード請求は残し、テスト実績だけ初期化しました。</div>':(S.beta?.mode==='beta'?'<div class="notice" style="margin-bottom:10px">BETAテストモードです。2026/8/31 0:00以降に本番へ自動切替します。設定と開始前カード請求は残ります。</div>':'');modal(`<h3>${S.beta?.mode==='beta'?'BETAを試す':'資産形成 DAY 1'}</h3>${launch}<div class="notice">MIRAIFLOWは「いくら使ったか」より「今いくら使えて、未来のお金をどれだけ守れているか」を管理します。</div><div class="formGroup" style="margin-top:14px"><label>給料入金後の口座内の全財産</label><input class="input" id="initAssets" type="number" placeholder="例 200000"></div><div class="formGroup"><label>${S.currentMonth}運用分の実際の手取り給料</label><input class="input" id="initSalary" type="number" value="${S.salary||200000}"></div><div class="actions"><button class="btn primary" onclick="finishFirst()">${S.beta?.mode==='beta'?'テストを開始':'MIRAIFLOWを始める'}</button></div>`) }
function finishFirst(){S.totalAssets=Number(initAssets.value)||0;S.salary=Number(initSalary.value)||200000;S.started=true;if(S.beta)S.beta.showLaunchNotice=false;addHistory('初回設定',`全財産 ${yen(S.totalAssets)} / 給料 ${yen(S.salary)}`);closeModal();save('MIRAIFLOWを開始しました')}


// ===== v3.5 Money clarity / reimbursement / forecast / reconciliation =====
function upgradeV35(){
  S.version=3.5;
  FIXED_META.motherTuition='母の大学授業料';
  if(S.budgets.motherTuition==null)S.budgets.motherTuition=25000;
  S.fixedConfig=S.fixedConfig&&typeof S.fixedConfig==='object'?S.fixedConfig:{};
  S.fixedConfig.motherTuition={day:null,paymentMethod:'bank',advance:true,reimbursementStatus:'received',reimbursedAmount:25000,...(S.fixedConfig.motherTuition||{})};
  S.cardReconciliations=Array.isArray(S.cardReconciliations)?S.cardReconciliations:[];
  S.reimbursementLedger=Array.isArray(S.reimbursementLedger)?S.reimbursementLedger:[];
  S.balanceAnalysis=Array.isArray(S.balanceAnalysis)?S.balanceAnalysis:[];
  S.settings={...S.settings,forecastDays:30};
  // 既存の固定費支払にも立替属性を復元
  S.fixedPayments.forEach(p=>{const c=S.fixedConfig[p.key]||{};if(p.advance==null&&c.advance)p.advance=true;if(p.reimbursedAmount==null&&c.advance)p.reimbursedAmount=Math.min(Number(p.amount)||0,Number(c.reimbursedAmount)||0)});
  localStorage.setItem('miraiflow',JSON.stringify(S));
}

function isReimbursedTx(t){return !!t.advance && (Number(t.reimbursedAmount)||0)>0}
function netExpenseAmount(t){if(t.kind!=='expense')return 0;return Math.max(0,(Number(t.amount)||0)-(Number(t.reimbursedAmount)||0))}
function expenseTotal(m=S.currentMonth){return txInMonth(m).filter(t=>t.kind==='expense').reduce((a,t)=>a+netExpenseAmount(t),0)}
function spentByCategory(cat,m=S.currentMonth){return txInMonth(m).filter(t=>t.kind==='expense'&&t.category===cat).reduce((a,t)=>a+netExpenseAmount(t),0)}
function ordinaryBudget(){return Object.entries(S.budgets).reduce((a,[k,v])=>a+(S.fixedConfig?.[k]?.advance?0:Number(v||0)),0)}
function fixedSpend(){return ordinaryBudget()-dynamicSpend()}

function openingReimbursedAmount(b){return Math.max(0,Math.min(Number(b.amount)||0,Number(b.reimbursedAmount)||0))}
function transactionReimbursedOnBill(card,date){return S.transactions.filter(t=>t.kind==='expense'&&t.paymentMethod===card&&(t.billingDate||cardBillingDate(card,t.date))===date).reduce((a,t)=>a+Math.min(Number(t.amount)||0,Number(t.reimbursedAmount)||0),0)}
function billReimbursedAmount(b){const opening=S.cardOpeningBills.filter(x=>x.card===b.card&&x.date===b.date).reduce((a,x)=>a+openingReimbursedAmount(x),0);return opening+transactionReimbursedOnBill(b.card,b.date)}
function cardOutstandingGross(){return derivedCardBills().filter(b=>!b.paid).reduce((a,b)=>a+(Number(b.amount)||0),0)}
function currentMonthPriorCardDrain(){return S.cardOpeningBills.filter(b=>monthOf(b.date)===S.currentMonth).reduce((a,b)=>a+Math.max(0,(Number(b.amount)||0)-openingReimbursedAmount(b)),0)}
function cardOutstandingNet(){return derivedCardBills().filter(b=>!b.paid).reduce((a,b)=>a+Math.max(0,(Number(b.amount)||0)-billReimbursedAmount(b)),0)}
function reimbursementReserve(){return derivedCardBills().filter(b=>!b.paid).reduce((a,b)=>a+billReimbursedAmount(b),0)}
function upcomingBankFixed(){let total=0;for(let i=0;i<2;i++){const d=new Date(S.currentMonth+'-01T00:00:00');d.setMonth(d.getMonth()+i);const m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;total+=fixedDueItems(m).filter(f=>!f.paid&&f.paymentMethod==='bank'&&!S.fixedConfig[f.key]?.advance).reduce((a,f)=>a+(Number(f.amount)||0),0)}return total}
function protectedObligations(){return cardOutstandingGross()+upcomingBankFixed()+totalAllocated()}
function effectiveSpendable(){return Math.max(0,S.totalAssets-protectedObligations())}

function forecastEntries(days=30){
  const start=new Date(todayISO()+'T00:00:00'),end=new Date(start);end.setDate(end.getDate()+days);
  const items=[];
  derivedCardBills().filter(b=>!b.paid).forEach(b=>{const d=new Date(b.date+'T00:00:00');if(d>=start&&d<=end)items.push({date:b.date,title:`${paymentLabel(b.card)}引落`,amount:-(Number(b.amount)||0),offset:billReimbursedAmount(b),kind:'card'})});
  for(let i=0;i<3;i++){const d=new Date(start.getFullYear(),start.getMonth()+i,1),m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;fixedDueItems(m).filter(f=>!f.paid&&f.paymentMethod==='bank').forEach(f=>{const dt=new Date(f.date+'T00:00:00');if(dt>=start&&dt<=end)items.push({date:f.date,title:f.title,amount:-(Number(f.amount)||0),offset:S.fixedConfig[f.key]?.advance?Math.min(Number(f.amount)||0,Number(S.fixedConfig[f.key]?.reimbursedAmount)||0):0,kind:'fixed'})})}
  return items.sort((a,b)=>a.date.localeCompare(b.date));
}
function forecastTimeline(days=30){let bal=S.totalAssets;const rows=[];for(const x of forecastEntries(days)){bal+=x.amount;rows.push({...x,balance:bal})}return rows}
function minimumForecastBalance(){const rows=forecastTimeline(30);return rows.length?Math.min(S.totalAssets,...rows.map(x=>x.balance)):S.totalAssets}
function shortageInfo(){const min=minimumForecastBalance(),need=Math.max(0,S.settings.minReserve-min);return{min,need,warning:need>0}}
function forecastAt(days){const end=new Date(todayISO()+'T00:00:00');end.setDate(end.getDate()+days);let bal=S.totalAssets;for(const x of forecastEntries(days))bal+=x.amount;return bal}

function moneyBoxes(){return {life:effectiveSpendable(),pending:cardOutstandingGross()+upcomingBankFixed(),funds:S.funds.reduce((a,f)=>a+(Number(f.balance)||0),0),growth:S.defense+S.investment,reimbursement:reimbursementReserve()}}

function analyzeBalanceDifference(actual){const expected=S.totalAssets,diff=Number(actual)-expected;const candidates=[];if(diff<0){const rec=S.cardReconciliations.filter(x=>!x.resolved&&x.diff>0).reduce((a,x)=>a+x.diff,0);if(rec)candidates.push(`未登録カード利用候補 ${yen(rec)}`);const unpaid=fixedDueItems().filter(f=>!f.paid&&f.date<=todayISO()).reduce((a,f)=>a+f.amount,0);if(unpaid)candidates.push(`固定費の支払実績未入力候補 ${yen(unpaid)}`);candidates.push('現金支出・手数料・引落の登録漏れを確認');}else if(diff>0){candidates.push('入金・返金・立替精算金の登録漏れを確認');}return{expected,actual:Number(actual),diff,candidates}}
function openBalanceReconcile(){modal(`<h3>口座残高の答え合わせ</h3><div class="notice">MIRAIFLOW計算残高 ${yen(S.totalAssets)} と実際の口座残高を比較します。</div><div class="formGroup" style="margin-top:12px"><label>実際の口座残高</label><input class="input" id="brActual" type="number" value="${S.totalAssets}"></div><div class="actions"><button class="btn primary" onclick="runBalanceAnalysis()">差額を分析</button></div>`)}
function runBalanceAnalysis(){const a=Number(document.querySelector('#brActual')?.value)||0,r=analyzeBalanceDifference(a);S.balanceAnalysis.unshift({date:new Date().toISOString(),...r});modal(`<h3>差額分析</h3><div class="card"><div class="label">差額</div><div class="mid ${r.diff<0?'neg':'pos'}">${r.diff>=0?'+':''}${yen(r.diff)}</div></div><div class="card">${r.diff===0?'<div class="notice">一致しています。かなりきれいに管理できています。</div>':`<b>確認候補</b><div class="list">${r.candidates.map(x=>`<div class="listItem"><span>${escapeHtml(x)}</span></div>`).join('')}</div>`}</div><div class="actions"><button class="btn" onclick="adjustBalanceFromAnalysis(${a})">実残高へ合わせる</button><button class="btn ghost" onclick="closeModal()">後で確認</button></div>`);localStorage.setItem('miraiflow',JSON.stringify(S))}
function adjustBalanceFromAnalysis(actual){const old=S.totalAssets;S.totalAssets=Math.max(0,Number(actual)||0);S.balanceChecks.unshift({date:new Date().toISOString(),old,new:S.totalAssets,diff:S.totalAssets-old,note:'残高照合による調整'});addHistory('残高照合',`${yen(old)} → ${yen(S.totalAssets)}`);closeModal();save('口座残高を実残高へ合わせました')}

function openOpeningBill(){modal(`<h3>運用開始前のカード請求を追加</h3><div class="notice">家計簿開始前に使った分は、予算へ再計上せず引落予定だけ登録します。家族分など精算済みの立替が含まれる場合、その金額も分けて記録できます。</div><div class="formGroup" style="margin-top:12px"><label>カード</label><select class="input" id="obCard"><option value="auCard">au PAYカード</option><option value="rakutenCard">楽天カード</option><option value="jcbCard">JCB</option></select></div><div class="formGroup"><label>引落日</label><input class="input" id="obDate" type="date" value="${S.currentMonth}-04"></div><div class="formGroup"><label>請求額</label><input class="input" id="obAmt" type="number"></div><div class="formGroup"><label>うち立替・精算済み額（任意）</label><input class="input" id="obReimb" type="number" value="0"><div class="tiny">例：母の大学授業料25,000円を現金でもらっている → 25000</div></div><div class="actions"><button class="btn primary" onclick="saveOpeningBill()">追加</button></div>`)}
function saveOpeningBill(){const card=document.querySelector('#obCard')?.value,date=document.querySelector('#obDate')?.value,amount=Math.max(0,Number(document.querySelector('#obAmt')?.value)||0),reimbursedAmount=Math.max(0,Number(document.querySelector('#obReimb')?.value)||0);if(!CARD_KEYS.includes(card)||!date||!amount){toast('カード・日付・金額を入力してください');return}if(reimbursedAmount>amount){toast('精算済み額は請求額以下にしてください');return}S.cardOpeningBills.push({id:uid(),card,date,amount,reimbursedAmount,note:'運用開始前利用分'});addHistory('カード初期請求',`${paymentLabel(card)} ${date} ${yen(amount)}${reimbursedAmount?' / 精算済 '+yen(reimbursedAmount):''}`);closeModal();save('過去分のカード請求を追加しました')}

function showCardBills(){const bills=derivedCardBills();modal(`<h3>カード請求一覧</h3><div class="list">${bills.length?bills.map(b=>{const rb=billReimbursedAmount(b);const rec=S.cardReconciliations.find(x=>x.key===b.key&&!x.resolved);return `<div class="listItem"><div><b>${paymentLabel(b.card)}</b><div class="meta">${b.date} ${b.paid?'・引落済':'・引落予定'}${rb?' ・ 立替精算 '+yen(rb):''}${rec?' ・ 差額 '+yen(rec.diff):''}</div></div><div style="text-align:right"><div class="money ${b.paid?'pos':'neg'}">${yen(b.paid?b.actualAmount:b.amount)}</div>${!b.paid?`<button class="btn small" onclick="confirmCardBill('${b.key}')">請求照合</button>`:''}</div></div>`}).join(''):'<div class="empty">請求はありません</div>'}</div>`)}
function confirmCardBill(key){const b=derivedCardBills().find(x=>x.key===key);if(!b)return;const rb=billReimbursedAmount(b);modal(`<h3>${paymentLabel(b.card)} 請求照合</h3><div class="card"><div class="label">MIRAIFLOW計算額</div><div class="mid">${yen(b.amount)}</div>${rb?`<div class="tiny">うち立替精算済み ${yen(rb)} / 実質負担 ${yen(Math.max(0,b.amount-rb))}<br>精算金が現金なら、引落前に口座へ入金してください。</div>`:''}</div><div class="formGroup"><label>カード会社の実際の請求額</label><input class="input" id="cbActual" type="number" value="${b.amount}"></div><div class="tiny">差額があれば「未登録利用候補」として記録します。引落確定時は口座残高だけを減らし、利用日の予算を二重計上しません。</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="payCardBill('${key}')">照合して引落済みにする</button></div>`)}
function payCardBill(key){const b=derivedCardBills().find(x=>x.key===key);if(!b||b.paid)return;const a=Math.max(0,Number(document.querySelector('#cbActual')?.value)||0);if(!a){toast('請求額を入力してください');return}const diff=a-b.amount;if(diff!==0){S.cardReconciliations.push({id:uid(),key,card:b.card,date:b.date,expected:b.amount,actual:a,diff,resolved:false,createdAt:new Date().toISOString()})}S.cardSettlements[key]={paid:true,actualAmount:a,paidAt:new Date().toISOString(),difference:diff};S.totalAssets=Math.max(0,S.totalAssets-a);addHistory('カード引落',`${paymentLabel(b.card)} ${b.date} -${yen(a)}${diff?` / 計算差 ${diff>0?'+':''}${yen(diff)}`:''}`);closeModal();save(diff?`引落を反映。計算額との差 ${diff>0?'+':''}${yen(diff)} を記録しました`:'カード請求とMIRAIFLOWが一致しました')}

function editFixedConfig(key){const c=S.fixedConfig[key]||{};const isMother=key==='motherTuition';modal(`<h3>${FIXED_META[key]}の支払設定</h3><div class="formGroup"><label>毎月の支払日（1〜31）</label><input class="input" id="fixDay" type="number" min="1" max="31" value="${c.day||''}" placeholder="例 25"></div><div class="formGroup"><label>支払方法</label>${paymentSelect('fixPay',c.paymentMethod||'bank',true)}</div><div class="formGroup"><label><input type="checkbox" id="fixAdvance" ${c.advance?'checked':''}> 家族分などの立替（自分の実質支出にしない）</label></div><div class="formGroup"><label>精算済み・受取済み金額</label><input class="input" id="fixReimb" type="number" value="${Number(c.reimbursedAmount)||0}"></div>${isMother?'<div class="notice">母の大学授業料は初期値25,000円・立替精算済みとして設定しています。カードだけあなたの実際の支払先に変更してください。</div>':'<div class="tiny">立替ONの場合、受取済み分はあなたの支出・貯金可能額から除外します。</div>'}<div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveFixedConfig('${key}')">保存</button></div>`)}

function payFixed(id){const month=id.slice(0,7),f=fixedDueItems(month).find(x=>x.id===id);if(!f||f.paid)return;const amount=Math.max(0,Number(document.querySelector('#fpAmt')?.value)||0),pm=document.querySelector('#fpMethod')?.value||f.paymentMethod,c=S.fixedConfig[f.key]||{},reimbursedAmount=c.advance?Math.min(amount,Number(c.reimbursedAmount)||0):0;if(!amount){toast('支払額を入力してください');return}S.fixedPayments.push({id,key:f.key,date:f.date,amount,paymentMethod:pm,advance:!!c.advance,reimbursedAmount,createdAt:new Date().toISOString()});if(pm==='bank')S.totalAssets=Math.max(0,S.totalAssets-amount);recordExpenseWithPayment({date:f.date,amount,category:'other',title:f.title,note:'固定費支払実績',paymentMethod:pm,advance:!!c.advance,reimbursedAmount});addHistory('固定費支払',`${f.title} ${yen(amount)} / ${paymentLabel(pm)}${c.advance?' / 立替 '+yen(reimbursedAmount):''}`);closeModal();save('固定費の支払実績を反映しました')}

// 固定費のカード払いはカード請求予定へ自動集計。カード以外だけ単独の口座支出として扱う。
function derivedCardBills(){
 const map={};
 S.transactions.filter(t=>t.kind==='expense'&&CARD_KEYS.includes(t.paymentMethod)&&!t.fixedAuto).forEach(t=>{const date=t.billingDate||cardBillingDate(t.paymentMethod,t.date);if(!date)return;const k=cardBillKey(t.paymentMethod,date);map[k]??={key:k,card:t.paymentMethod,date,amount:0,source:'usage'};map[k].amount+=Number(t.amount)||0});
 S.cardOpeningBills.forEach(b=>{const k=cardBillKey(b.card,b.date);map[k]??={key:k,card:b.card,date:b.date,amount:0,source:'opening'};map[k].amount+=Number(b.amount)||0;map[k].source=map[k].source==='usage'?'mixed':'opening'});
 // 毎月のカード払い固定費を、その月のカード引落へ自動加算
 const months=new Set([S.currentMonth]);
 const cur=new Date(S.currentMonth+'-01T00:00:00');for(let i=-1;i<=3;i++){const d=new Date(cur);d.setMonth(d.getMonth()+i);months.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`)}
 months.forEach(month=>Object.entries(S.fixedConfig||{}).forEach(([key,c])=>{if(!isCardMethod(c.paymentMethod))return;const date=cardScheduledDebitDate(c.paymentMethod,month);const k=cardBillKey(c.paymentMethod,date);const pid=`${month}|${key}`,paid=S.fixedPayments.find(x=>x.id===pid),amt=Number(paid?.amount??S.budgets[key])||0;if(!amt)return;map[k]??={key:k,card:c.paymentMethod,date,amount:0,source:'fixed'};map[k].amount+=amt;map[k].source=map[k].source==='usage'||map[k].source==='opening'?'mixed':'fixed'}));
 return Object.values(map).map(b=>{const st=S.cardSettlements[b.key]||{};return {...b,paid:!!st.paid,actualAmount:st.actualAmount??b.amount,paidAt:st.paidAt||null}}).sort((a,b)=>a.date.localeCompare(b.date));
}
function cashflowForDate(date){const arr=[];derivedCardBills().filter(b=>b.date===date).forEach(b=>arr.push({type:b.paid?'inc':'exp',subtype:'cardBill',id:b.key,card:b.card,title:`${paymentLabel(b.card)}引落${b.paid?'済':''}`,amount:b.paid?b.actualAmount:b.amount,paid:b.paid}));fixedDueItems(date.slice(0,7)).filter(x=>x.date===date&&!isCardMethod(x.paymentMethod)).forEach(f=>arr.push({type:f.paid?'inc':'exp',subtype:'fixed',id:f.id,title:`${f.title}${f.paid?' 支払済':''}`,amount:f.paid?f.actualAmount:f.amount,paid:f.paid}));return arr}
function upcomingCashflow(limit=3){const today=todayISO(),cards=derivedCardBills().filter(x=>x.date>=today&&!x.paid).map(x=>({...x,title:`${paymentLabel(x.card)}引落`,type:'exp'})),fixed=[];for(let i=0;i<2;i++){const d=new Date(S.currentMonth+'-01T00:00:00');d.setMonth(d.getMonth()+i);const m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;fixed.push(...fixedDueItems(m).filter(x=>x.date>=today&&!x.paid&&!isCardMethod(x.paymentMethod)).map(x=>({...x,title:x.title,type:'exp'})))}return[...cards,...fixed].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,limit)}

function personalBudgetAvailable(m=S.currentMonth){if(m===S.currentMonth)return Math.max(0,Number(S.personalWallet?.available)||10000);return Number(S.budgets.personal)||10000}
function categoryBudgetFor(k,m=S.currentMonth){return k==='personal'?personalBudgetAvailable(m):Number(S.budgets[k])||0}
function formatCompactYen(n){n=Math.round(Number(n)||0);if(Math.abs(n)>=10000)return `${(n/10000).toFixed(n%10000?1:0)}万`;return fmt(n)}

const __showScreen36=showScreen;

function openMainMenu(){modal(`<h3>MIRAIFLOW メニュー</h3><div class="list">
 <button class="btn" onclick="closeModal();showScreen('settings')">設定</button>
 <button class="btn" onclick="closeModal();openFixedConfigList()">固定費設定</button>
 <button class="btn" onclick="closeModal();showCardBills()">カード管理・請求照合</button>
 <button class="btn" onclick="closeModal();openMonthEndUpdate()">月末更新</button>
 <button class="btn" onclick="closeModal();updateBalance()">口座残高更新</button>
 <button class="btn" onclick="backup()">バックアップ</button>
 <button class="btn ghost" onclick="closeModal()">閉じる</button>
 </div>`)}
document.querySelector('#homeMenuBtn')?.addEventListener('click',openMainMenu);

function openFixedConfigList(){const rows=Object.entries(FIXED_META).map(([k,n])=>{const c=S.fixedConfig?.[k]||{},pm=c.paymentMethod||'bank';return `<div class="listItem"><div><b>${escapeHtml(n)}</b><div class="meta">${paymentLabel(pm)}${isCardMethod(pm)?' ・ 引落日自動':' ・ '+(c.day?c.day+'日':'日付未設定')}</div></div><button class="btn small" onclick="editFixedConfig('${k}')">設定</button></div>`}).join('');modal(`<h3>固定費設定</h3><div class="notice">ここは支払ルールを設定する場所です。毎月の実際額は「記録 → 固定費」で入力します。</div><div class="list" style="margin-top:10px">${rows}</div>`)}

function fixedRecordItems(month=S.currentMonth){return fixedDueItems(month).map(f=>({...f,lastAmount:lastFixedAmount(f.key,month)}))}
function lastFixedAmount(key,month){const prev=nextMonthOf(nextMonthOf(nextMonthOf(month)));/* overwritten below */return Number(S.budgets[key])||0}
function prevMonthOf(m){const [y,mo]=m.split('-').map(Number),d=new Date(y,mo-2,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
lastFixedAmount=function(key,month){const p=S.fixedPayments.find(x=>x.id===`${prevMonthOf(month)}|${key}`);return Number(p?.amount??S.budgets[key])||0}
function openFixedRecord(){const items=fixedRecordItems();modal(`<h3>${S.currentMonth} 固定費を記録</h3><div class="notice">実際に払った金額だけ確認します。支払方法と日付は設定済みなので、ここでは選びません。</div><div class="list" style="margin-top:10px">${items.map(f=>`<div class="listItem"><div><b>${escapeHtml(f.title)}</b><div class="meta">${paymentLabel(f.paymentMethod)} ・ ${f.date}${f.autoDate?'（自動）':''}<br>前回/基準 ${yen(f.lastAmount)}</div></div><div style="text-align:right">${f.paid?`<span class="badge safe">確定 ${yen(f.actualAmount)}</span>`:`<button class="btn small primary" onclick="confirmFixedPayment('${f.id}')">金額入力</button>`}</div></div>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="confirmSameFixedAll()">未確定を前回と同額で一括確定</button></div>`)}
confirmFixedPayment=function(id){const f=fixedDueItems(id.slice(0,7)).find(x=>x.id===id);if(!f)return;const base=lastFixedAmount(f.key,id.slice(0,7));modal(`<h3>${f.title}</h3><div class="notice">${paymentLabel(f.paymentMethod)} ・ ${f.date}${f.autoDate?'（カード引落日を自動設定）':''}</div><div class="formGroup" style="margin-top:12px"><label>実際に払った金額</label><input class="input" id="fpAmt" type="number" inputmode="numeric" value="${base}"></div><div class="actions"><button class="btn primary" onclick="payFixedSimple('${id}')">確定</button></div>`)}
function payFixedSimple(id){const month=id.slice(0,7),f=fixedDueItems(month).find(x=>x.id===id);if(!f||f.paid)return;const amount=Math.max(0,Number(document.querySelector('#fpAmt')?.value)||0),pm=f.paymentMethod,c=S.fixedConfig[f.key]||{},reimbursedAmount=c.advance?Math.min(amount,Number(c.reimbursedAmount)||0):0;if(!amount){toast('金額を入力してください');return}S.fixedPayments.push({id,key:f.key,date:f.date,amount,paymentMethod:pm,advance:!!c.advance,reimbursedAmount,createdAt:new Date().toISOString()});if(pm==='bank'||pm==='cash')S.totalAssets=Math.max(0,S.totalAssets-amount);recordExpenseWithPayment({date:f.date,amount,category:'other',title:f.title,note:'固定費支払実績',paymentMethod:pm,advance:!!c.advance,reimbursedAmount,fixedAuto:true});addHistory('固定費支払',`${f.title} ${yen(amount)} / ${paymentLabel(pm)}`);closeModal();save('固定費を確定しました')}
function confirmSameFixedAll(){const pending=fixedRecordItems().filter(x=>!x.paid);if(!pending.length){toast('未確定の固定費はありません');return}if(!confirm(`${pending.length}件を前回/基準額で一括確定しますか？`))return;pending.forEach(f=>{const amount=f.lastAmount,pm=f.paymentMethod,c=S.fixedConfig[f.key]||{},reimbursedAmount=c.advance?Math.min(amount,Number(c.reimbursedAmount)||0):0;S.fixedPayments.push({id:f.id,key:f.key,date:f.date,amount,paymentMethod:pm,advance:!!c.advance,reimbursedAmount,createdAt:new Date().toISOString()});if(pm==='bank'||pm==='cash')S.totalAssets=Math.max(0,S.totalAssets-amount);recordExpenseWithPayment({date:f.date,amount,category:'other',title:f.title,note:'固定費一括確定',paymentMethod:pm,advance:!!c.advance,reimbursedAmount,fixedAuto:true})});closeModal();save('固定費を一括確定しました')}

renderRecord=function(){const rows=renderRecordRows();document.querySelector('#record').innerHTML=`<div class="sectionTitle"><h2>記録</h2><span>普段の入力はここだけ</span></div>
 <div class="grid2"><button class="card btn primary" onclick="document.querySelector('#receiptFile').click()">▣ レシート</button><button class="card btn" onclick="openExpense()">＋ レシートなし</button><button class="card btn" onclick="openFixedRecord()">▤ 固定費</button><button class="card btn" onclick="showCardBills()">💳 カード請求確認</button></div>
 <div class="notice">買い物はレシート撮影→AI分類→支払方法だけ選択。固定費は実際額だけ。カード引落時は実請求額だけ確認します。</div>
 <div class="sectionTitle"><h2>最近の記録</h2><span>${rows.length}件</span></div><div class="card list">${rows.length?rows.slice(0,12).join(''):'<div class="empty">まだ記録がありません</div>'}</div>`}

// Opening bills: choose target month, debit date remains automatic.
openOpeningBill=function(){const base=S.currentMonth,prev=prevMonthOf(base),next=nextMonthOf(base);modal(`<h3>開始前カード請求</h3><div class="notice">対象月とカードを選ぶだけで引落日は自動です。過去の買い物明細を入れ直す必要はありません。</div><div class="formGroup" style="margin-top:12px"><label>引落対象月</label><select class="input" id="obMonth"><option value="${prev}">${prev}</option><option value="${base}" selected>${base}</option><option value="${next}">${next}</option></select></div><div class="formGroup"><label>カード</label><select class="input" id="obCard"><option value="auCard">au PAYカード</option><option value="rakutenCard">楽天カード</option><option value="jcbCard">JCB</option></select></div><div class="formGroup"><label>実際の請求予定額</label><input class="input" id="obAmt" type="number" inputmode="numeric" placeholder="0"></div><div id="obPreview" class="notice"></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveOpeningBill36()">登録</button></div>`);const upd=()=>{const c=document.querySelector('#obCard').value,m=document.querySelector('#obMonth').value;document.querySelector('#obPreview').innerHTML=`${paymentLabel(c)} → <b>${cardScheduledDebitDate(c,m)}</b> 引落予定`};document.querySelector('#obCard').onchange=upd;document.querySelector('#obMonth').onchange=upd;upd()}
function saveOpeningBill36(){const card=document.querySelector('#obCard')?.value,amount=Math.max(0,Number(document.querySelector('#obAmt')?.value)||0),month=document.querySelector('#obMonth')?.value||S.currentMonth,date=cardScheduledDebitDate(card,month);if(!CARD_KEYS.includes(card)||!amount||!date){toast('カードと請求額を入力してください');return}const mother=S.fixedConfig?.motherTuition||{},motherReimb=mother.paymentMethod===card&&mother.advance?Math.min(amount,Number(mother.reimbursedAmount)||25000):0;S.cardOpeningBills.push({id:uid(),card,date,amount,reimbursedAmount:motherReimb,note:`運用開始前利用分 ${month}`});closeModal();save(`${paymentLabel(card)} ${date}の請求を登録しました`)}

function monthTx(m){return S.transactions.filter(t=>monthOf(t.date)===m&&t.kind==='expense'&&!t.advance)}
function monthIncome(m){return S.transactions.filter(t=>monthOf(t.date)===m&&t.kind==='income').reduce((a,t)=>a+(Number(t.amount)||0),0)+(m===S.currentMonth?S.salary:0)}
function monthExpense(m){return monthTx(m).reduce((a,t)=>a+(Number(t.amount)||0),0)}
function categorySpendMonth(k,m){return monthTx(m).filter(t=>t.category===k).reduce((a,t)=>a+(Number(t.amount)||0),0)}
function fixedPaidMonth(m){return S.fixedPayments.filter(p=>p.id?.startsWith(m+'|')).reduce((a,p)=>a+(p.advance?Math.max(0,(Number(p.amount)||0)-(Number(p.reimbursedAmount)||0)):(Number(p.amount)||0)),0)}
function resultSummary(m){const income=m===S.currentMonth?S.salary:(S.monthClosures[m]?.salary||0),expense=monthExpense(m),fund=Object.values(S.fundContribs?.[m]||{}).reduce((a,v)=>a+(Number(v)||0),0),net=income-expense-fund;const saved=Math.max(0,net),defAdd=m===S.currentMonth?Math.max(0,S.defense-(S.monthClosures[prevMonthOf(m)]?.defense||0)):(S.monthClosures[m]?.saved||0);return{income,expense,fund,net,saved,defAdd}}
function resultCategoryRow(k,m,prev){const spent=categorySpendMonth(k,m),budget=categoryBudgetFor(k,m),pct=budget?spent/budget*100:0,ps=categorySpendMonth(k,prev),diff=spent-ps;return `<div class="progressRow"><div class="progressHead"><div><b>${S.categories[k]}</b><div class="tiny">先月 ${yen(ps)} ・ ${diff===0?'同額':diff>0?'+'+yen(diff):'-'+yen(Math.abs(diff))}</div></div><div style="text-align:right"><b class="${spent>budget?'money neg':''}">${yen(spent)} / ${yen(budget)}</b><div class="tiny">${spent>budget?`${yen(spent-budget)}オーバー`:`残り ${yen(Math.max(0,budget-spent))}`}</div></div></div><div class="progressTrack"><div class="progressFill ${spent>budget?'over':''}" style="width:${Math.min(100,pct)}%"></div></div></div>`}
function renderResults(){const el=document.querySelector('#results');if(!el)return;const m=S.resultMonth||S.currentMonth,prev=prevMonthOf(m),sum=resultSummary(m),tx=monthTx(m).slice().sort((a,b)=>(b.date+(b.id||'')).localeCompare(a.date+(a.id||''))),fixed=fixedDueItems(m),paid=fixed.filter(x=>x.paid).length,cards=derivedCardBills().filter(b=>monthOf(b.date)===m);const cats=['food','dining','personal','gas','tobacco'];el.innerHTML=`<div class="sectionTitle"><h2>実績</h2><span>使った・余った・貯まったを確認</span></div><div class="calendarHead"><button class="btn small" onclick="moveResultMonth(-1)">‹</button><b>${m}</b><button class="btn small" onclick="moveResultMonth(1)">›</button></div>
 <div class="resultHero"><div class="mini"><div class="label">収入</div><div class="value">${yen(sum.income)}</div></div><div class="mini"><div class="label">実支出</div><div class="value">${yen(sum.expense)}</div></div><div class="mini"><div class="label">余り / 赤字</div><div class="value ${sum.net<0?'money neg':'money pos'}">${sum.net<0?'-':''}${yen(Math.abs(sum.net))}</div></div><div class="mini"><div class="label">今月の貯金可能額</div><div class="value">${yen(sum.saved)}</div></div></div>
 <div class="card" style="margin-top:10px"><div class="budgetItem"><div><div class="label">累計生活防衛資金</div><div class="mid">${yen(S.defense)}</div></div><div><div class="label">累計投資</div><div class="mid">${yen(S.investment)}</div></div></div><div class="tiny" style="margin-top:8px">積立 ${yen(sum.fund)} ・ 防衛資金42万円までは投資0%</div></div>
 <div class="sectionTitle"><h2>カテゴリ進捗</h2><span>予算と先月比較</span></div><div class="card">${cats.map(k=>resultCategoryRow(k,m,prev)).join('')}</div>
 <div class="sectionTitle"><h2>固定費</h2><span>${paid}/${fixed.length}件確定</span></div><div class="card list">${fixed.map(f=>`<div class="listItem"><div><b>${escapeHtml(f.title)}</b><div class="meta">${paymentLabel(f.paymentMethod)} ・ ${f.date}</div></div><div>${f.paid?`<span class="badge safe">${yen(f.actualAmount)}</span>`:`<button class="btn small" onclick="openFixedRecord()">未確定</button>`}</div></div>`).join('')||'<div class="empty">設定なし</div>'}</div>
 <div class="sectionTitle"><h2>カード引落</h2><span>${cards.length}件</span></div><div class="card list">${cards.map(b=>`<div class="listItem"><div><b>${paymentLabel(b.card)}</b><div class="meta">${b.date} ${b.paid?'・確認済':'・予定'}</div></div><div>${yen(b.paid?b.actualAmount:b.amount)}</div></div>`).join('')||'<div class="empty">この月の引落はありません</div>'}</div>
 <div class="sectionTitle"><h2>全明細</h2><span>${tx.length}件</span></div><div class="card list">${tx.length?tx.slice(0,60).map(t=>`<div class="listItem"><div><b>${escapeHtml(t.title||S.categories[t.category]||'支出')}</b><div class="meta">${t.date} ・ ${S.categories[t.category]||'その他'} ・ ${paymentLabel(t.paymentMethod||'cash')}</div></div><div class="money neg">-${yen(t.amount)}</div></div>`).join(''):'<div class="empty">明細はありません</div>'}</div>`}
function moveResultMonth(n){const [y,m]=(S.resultMonth||S.currentMonth).split('-').map(Number),d=new Date(y,m-1+n,1);S.resultMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;renderResults()}

renderCalendar=function(){const y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,cells=[];for(let i=0;i<42;i++){const n=i-start+1,d=new Date(y,m,n),di=iso(d),own=d.getMonth()===m,items=[...cashflowForDate(di).map(e=>({type:e.subtype==='cardBill'?'exp':'plan',title:e.subtype==='cardBill'?paymentLabel(e.card):e.title,amount:e.amount})),...S.events.filter(e=>e.date===di).map(e=>({type:'plan',title:e.title,amount:e.amount})),...displayTxForDate(di).map(e=>({type:e.type,title:e.title,amount:e.amount}))],shown=items.slice(0,3);cells.push(`<div class="day ${own?'':'muted'} ${di===todayISO()?'today':''}" onclick="openDay('${di}')"><div class="n">${d.getDate()}</div>${shown.map(e=>`<div class="ev ${e.type}">${escapeHtml(e.title)} ${e.amount?formatCompactYen(e.amount):''}</div>`).join('')}${items.length>3?`<div class="calendarMore">+${items.length-3}件</div>`:''}</div>`)}document.querySelector('#calendar').innerHTML=`<div class="calendarHead"><button class="btn small" onclick="moveCal(-1)">‹</button><div class="mid">${y}年 ${m+1}月</div><button class="btn small" onclick="moveCal(1)">›</button></div><div class="calendar">${['月','火','水','木','金','土','日'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.join('')}</div>`}

// Personal wallet: monthly +10,000, max carry/available 20,000. Excess goes through savings allocation.
function applyPersonalWalletNextMonth(){ensureV36State();const spent=spentByCategory('personal'),remaining=Math.max(0,personalBudgetAvailable()-spent),raw=remaining+10000,nextAvailable=Math.min(20000,raw),overflow=Math.max(0,raw-20000);S.personalWallet.available=nextAvailable;S.personalWallet.lastMonth=nextMonthOf(S.currentMonth);if(overflow>0){const a=allocateSurplusAutomatically(overflow);addHistory('個人用繰越上限',`翌月個人用 ${yen(nextAvailable)} / 超過 ${yen(overflow)} → ${a.log.join(' / ')||'貯金'}`)}return{nextAvailable,overflow}}
const __applyMonthEndUpdate36=applyMonthEndUpdate;
applyMonthEndUpdate=function(){applyPersonalWalletNextMonth();return __applyMonthEndUpdate36()}

const __renderHome36=renderHome;
renderHome=function(){ensureV36State();__renderHome36();const p=document.querySelector('#home');if(!p)return;const cards=p.querySelectorAll('.mini.budgetItem');cards.forEach(c=>{if(c.textContent.includes('個人用')){const used=spentByCategory('personal'),avail=personalBudgetAvailable(),left=Math.max(0,avail-used);c.innerHTML=`<div><small>個人用</small><div><b>${yen(left)}</b></div></div><div class="tiny">${yen(used)} / 今月枠 ${yen(avail)}<br>翌月＋1万円・上限2万円</div>`}})}

// v3.6.1 resilient rendering: one broken screen must never blank the whole app.
function renderScreenSafely(id,fn,label){
 const el=document.querySelector('#'+id);if(!el)return;
 try{fn()}catch(err){
  console.error('[MIRAIFLOW '+label+']',err);
  el.innerHTML=`<div class="sectionTitle"><h2>${label}</h2></div><div class="card"><div class="notice">この画面の表示に失敗しました。他の画面はそのまま利用できます。</div><div class="tiny" style="margin-top:8px">${escapeHtml(err?.message||String(err))}</div></div>`;
 }
}
renderAll=function(){
 ensureV36State();
 renderScreenSafely('home',renderHome,'ホーム');
 renderScreenSafely('calendar',renderCalendar,'カレンダー');
 renderScreenSafely('record',renderRecord,'記録');
 renderScreenSafely('results',renderResults,'実績');
 renderScreenSafely('assets',renderAssets,'資産');
 renderScreenSafely('settings',renderSettings,'設定');
 const pt=document.querySelector('#periodText');if(pt)pt.textContent=`${S.currentMonth.replace('-','年')}月の家計 ・ 月末給料→翌月運用`;
 updateModeBadge();updateHomeMenuVisibility();
}
window.addEventListener('error',e=>console.error('[MIRAIFLOW runtime]',e.error||e.message));
