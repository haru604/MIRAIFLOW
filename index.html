<style>
:root{
 --bg:#07111f;--bg2:#0a1729;--card:#0d1d33;--card2:#102440;--line:#1d3555;

 --shadow:0 10px 30px rgba(0,0,0,.22);--radius:20px;
}
*{box-sizing:border-box} html,body{margin:0;background:linear-gradient(180deg,var(--bg),#081728 52%,#06101d);color:var(--text);font-family:Inter,system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100%}
body{padding-bottom:92px} button,input,select,textarea{font:inherit}.app{max-width:760px;margin:0 auto;padding:16px 14px 110px}.topbar{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}.brand{display:flex;gap:10px;align-items:center}.brand img{width:38px;height:38px;border-radius:12px}.brand h1{font-size:20px;margin:0;letter-spacing:.05em}.sub{font-size:12px;color:var(--muted)}
.card{background:linear-gradient(180deg,rgba(16,36,64,.96),rgba(11,26,46,.96));border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}.hero{padding:18px}.label{font-size:12px;color:var(--muted)}.big{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:4px 0}.mid{font-size:22px;font-weight:760}.row{display:flex;gap:10px}.row>*{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mini{background:rgba(255,255,255,.025);border:1px solid #173052;border-radius:16px;padding:12px}.mini .value{font-size:18px;font-weight:760;margin-top:4px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.04em}.modeBadge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900;letter-spacing:.08em;border:1px solid #375375}.modeBadge.beta{color:#231600;background:var(--amber);border-color:#d89c3e}.modeBadge.production{color:#052019;background:var(--green);border-color:#45b989}.safe{color:#04140f;background:var(--green)}.watch{color:#2a1600;background:var(--amber)}.danger{color:#30040a;background:var(--red)}.progress{height:9px;background:#081325;border-radius:99px;overflow:hidden;margin:10px 0}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px}.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:18px 4px 9px}.sectionTitle h2{font-size:16px;margin:0}.sectionTitle span{font-size:11px;color:var(--muted)}
.budgetItem{display:flex;justify-content:space-between;align-items:center;gap:8px}.budgetItem b{font-size:18px}.budgetItem small{color:var(--muted)}.list{display:flex;flex-direction:column;gap:8px}.listItem{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid #17304f;border-radius:14px;background:rgba(255,255,255,.02)}.listItem .meta{color:var(--muted);font-size:12px}.money.neg{color:#ff8d9a}.money.pos{color:#73e6b3}.money.hold{color:#66d9ff}
.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:rgba(5,14,26,.94);backdrop-filter:blur(16px);border-top:1px solid #18304d;padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;border:0;color:#7187a4;padding:7px 2px;font-size:11px}.nav button.active{color:var(--cyan)}.nav .ico{display:block;font-size:20px;margin-bottom:2px}.fab{position:fixed;right:18px;bottom:92px;width:58px;height:58px;border:0;border-radius:19px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#031016;font-size:30px;font-weight:500;box-shadow:0 12px 28px rgba(41,205,220,.25);z-index:21}.screen{display:none}.screen.active{display:block}
.btn{border:1px solid #285079;background:#132c4b;color:var(--text);border-radius:13px;padding:11px 14px;font-weight:700}.btn.primary{background:linear-gradient(135deg,#269cff,#29e0c3);border:none;color:#04141a}.btn.ghost{background:transparent}.btn.red{border-color:#6d2b38;color:#ff9aaa}.btn.small{padding:8px 10px;font-size:12px}.input{width:100%;background:#071729;border:1px solid #1b3a5f;color:white;border-radius:13px;padding:12px 13px;outline:none}.input:focus{border-color:#39b8db}.formGroup{margin-bottom:12px}.formGroup label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.modalBack{display:none;position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.62);padding:20px;align-items:flex-end;justify-content:center}.modalBack.show{display:flex}.modal{width:min(680px,100%);max-height:88vh;overflow:auto;background:#0b1b30;border:1px solid #24476d;border-radius:24px 24px 18px 18px;padding:18px}.modal h3{margin:0 0 14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1}.calendarHead{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{font-size:11px;color:var(--muted);text-align:center;padding:5px 0}.day{height:76px;min-height:76px;max-height:76px;overflow:hidden;padding:5px;border-radius:13px;border:1px solid #152d49;background:#0a192b;position:relative}.day.muted{opacity:.35}.day.today{border-color:var(--cyan)}.day .n{font-size:10px;font-weight:800}.ev{margin-top:2px;padding:2px 3px;border-radius:5px;font-size:7.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#163354;color:#cbe9ff}.ev.exp{background:#38222c;color:#ffc5cb}.ev.plan{background:#2c2b17;color:#ffe2a0}.ev.inc{background:#16362d;color:#a9f3cf}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.tabs button{white-space:nowrap}.tabs button.active{border-color:var(--cyan);color:var(--cyan)}.chart{height:180px;display:flex;align-items:end;gap:6px;padding:14px 6px 4px}.bar{flex:1;min-width:12px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,var(--cyan),#207ad7);position:relative}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted)}.notice{padding:11px 12px;border-radius:14px;background:#0c2436;border:1px solid #1b5161;color:#c7f9f2;font-size:13px}.empty{color:var(--muted);text-align:center;padding:20px;font-size:13px}.receiptPreview{width:100%;max-height:260px;object-fit:contain;background:#06101d;border-radius:14px;border:1px solid #17324f}.settingRow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #17304c}.settingRow:last-child{border-bottom:0}.tiny{font-size:10px;color:var(--muted)}.aiStatus{display:inline-flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.on{background:var(--green);box-shadow:0 0 12px rgba(92,224,168,.45)}.dot.off{background:var(--red)}.receiptItems{display:flex;flex-direction:column;gap:8px;margin:10px 0}.receiptItem{display:grid;grid-template-columns:1fr 110px;gap:8px;padding:10px;border:1px solid #17324f;border-radius:13px;background:#071729}.receiptItem .name{font-size:13px;font-weight:700}.receiptItem .amt{font-size:12px;color:var(--muted)}.toastMsg{position:fixed;left:50%;bottom:112px;transform:translateX(-50%) translateY(10px);z-index:90;background:#102b43;border:1px solid #2e5b77;color:#eaf7ff;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}.toastMsg.show{opacity:1;transform:translateX(-50%) translateY(0)}.spinner{width:18px;height:18px;border:2px solid #31516f;border-top-color:var(--cyan);border-radius:50%;display:inline-block;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:420px){.big{font-size:30px}.day{height:66px;min-height:66px;max-height:66px;padding:4px}.ev{font-size:7px}.app{padding-left:11px;padding-right:11px}}
.menuBtn{width:42px;height:42px;border-radius:14px;border:1px solid #285079;background:#102440;color:var(--text);font-size:22px;display:grid;place-items:center}.progressRow{margin:10px 0}.progressHead{display:flex;justify-content:space-between;gap:8px;align-items:end}.progressTrack{height:8px;background:#071325;border-radius:99px;overflow:hidden;margin-top:6px}.progressFill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px}.progressFill.over{background:var(--red)}.resultHero{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.resultHero .mini{min-height:84px}.filterRow{display:flex;gap:6px;overflow:auto;margin:8px 0 10px}.filterRow button{white-space:nowrap}.calendarMore{font-size:7px;color:var(--muted);margin-top:2px;text-align:right}.screenTitleRow{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
</style>

<body>
<div class="app">
  <div class="topbar"><div class="brand"><img src="icon-192.png"><div><h1>MIRAIFLOW</h1><div class="sub" id="periodText">未来のお金を、見えるように。</div><div class="tiny" style="margin-top:2px">Build v3.6.4-beta</div></div></div><div style="display:flex;align-items:center;gap:7px"><span id="modeBadge" class="modeBadge beta">BETA</span><button class="menuBtn" id="homeMenuBtn" aria-label="メニュー">☰</button></div></div>

  <section id="home" class="screen active"></section>
  <section id="calendar" class="screen"></section>
  <section id="record" class="screen"></section>
  <section id="results" class="screen"></section>
  <section id="assets" class="screen"></section>
  <section id="settings" class="screen"></section>
</div>
<button class="fab" id="fab">＋</button>
<nav class="nav">
 <button data-screen="home" class="active"><span class="ico">⌂</span>ホーム</button>
 <button data-screen="calendar"><span class="ico">▦</span>カレンダー</button>
 <button data-screen="record"><span class="ico">＋</span>記録</button>
 <button data-screen="results"><span class="ico">▤</span>実績</button>
 <button data-screen="assets"><span class="ico">◈</span>資産</button>
</nav>

<div class="modalBack" id="modalBack"><div class="modal" id="modal"></div></div>
<input type="file" id="receiptFile" accept="image/*" capture="environment" hidden />
<div class="toastMsg" id="toastMsg"></div>
<script>
const fmt=n=>new Intl.NumberFormat('ja-JP').format(Math.round(Number(n)||0));
const yen=n=>'¥'+fmt(n);
const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const todayISO=()=>iso(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const deep=o=>JSON.parse(JSON.stringify(o));
const DEFAULT={
 version:3.6, started:false, totalAssets:0, defense:0, investment:0, currentMonth:'2026-09', salary:200000,
 budgets:{father:30000,carLoan:57600,aflac:1354,carInsurance:6470,rakuten:2662,youtube:1280,chatgpt:2500,food:30000,gas:7000,tobacco:18000,dining:4000,personal:10000},
 categories:{food:'食費',gas:'ガソリン',tobacco:'たばこ',dining:'外食',personal:'個人用',other:'その他'},
 funds:[
  {id:'inspection',name:'車検',icon:'🚗',target:120000,balance:0,due:'2027-10-31',repeat:false,cap:null},
  {id:'tax',name:'自動車税',icon:'🚘',target:39500,balance:0,due:'2027-04-30',repeat:true,cap:null},
  {id:'hospital',name:'通院',icon:'🏥',target:5000,balance:0,due:'2026-09-30',repeat:true,cap:5000},
  {id:'maintenance',name:'車メンテ',icon:'🔧',target:15000,balance:0,due:null,repeat:true,cap:15000}
 ],
 transactions:[], events:[
  {id:'oil',date:'2026-09-15',type:'plan',title:'オイル交換',amount:5000,fundId:'maintenance',note:'9月中予定'},
  {id:'hospitalNext',date:'2026-10-15',type:'plan',title:'通院',amount:5000,category:'other',fundId:'hospital',note:'次回通院予定'}
 ],
 suggestions:[], history:[], monthClosures:{}, balanceChecks:[], receipts:[], settings:{maintenanceMonthly:1000,minReserve:5000,aiEnabled:true,notifications:false,receiptApiUrl:'https://aowfhgsszultluejxupm.supabase.co/functions/v1/miraiflow-receipt'}
};
let S=load(); let calDate=new Date(S.currentMonth+'-01T00:00:00');
function load(){
 try{
  const raw=JSON.parse(localStorage.getItem('miraiflow')||'{}');
  const base=deep(DEFAULT);
  const merged={...base,...raw,budgets:{...base.budgets,...(raw.budgets||{})},categories:{...base.categories,...(raw.categories||{})},settings:{...base.settings,...(raw.settings||{})}};
  merged.funds=Array.isArray(raw.funds)?raw.funds:base.funds;
  merged.transactions=Array.isArray(raw.transactions)?raw.transactions:[];
  merged.events=Array.isArray(raw.events)?raw.events:base.events;
  merged.suggestions=Array.isArray(raw.suggestions)?raw.suggestions:[];
  merged.history=Array.isArray(raw.history)?raw.history:[];
  merged.monthClosures=raw.monthClosures||{};
  merged.balanceChecks=Array.isArray(raw.balanceChecks)?raw.balanceChecks:[];
  merged.receipts=Array.isArray(raw.receipts)?raw.receipts:[];
  // v3以前の既存データも自動修正：オイル交換を個人用から車メンテへ移す
  const oil=merged.events.find(e=>e.id==='oil'||e.title==='オイル交換');
  if(oil&&oil.type==='plan'&&!oil.completed){delete oil.category;oil.fundId='maintenance'}
  
  // v3.2: Cloudflare設定をSupabaseへ移行。古いWorker URLは誤接続防止のため解除
  if((merged.settings.receiptApiUrl||'').includes('workers.dev')) merged.settings.receiptApiUrl='';
  merged.version=3.5;
  return merged;
 }catch(e){return deep(DEFAULT)}
}
function save(msg){localStorage.setItem('miraiflow',JSON.stringify(S)); if(msg) toast(msg); renderAll()}
function purgeLegacyReceiptImages(){try{if('indexedDB' in window)indexedDB.deleteDatabase('miraiflow-receipts')}catch(e){console.warn('legacy receipt image purge failed',e)}}
function clearReceiptTemp(){window.__receiptData=null;window.__receiptAI=null}
function addHistory(action,detail){S.history.unshift({id:uid(),date:new Date().toISOString(),action,detail});S.history=S.history.slice(0,200)}
function monthOf(date){return date.slice(0,7)}
function txInMonth(m=S.currentMonth){return S.transactions.filter(t=>monthOf(t.date)===m)}
function eventsInMonth(m=S.currentMonth){return S.events.filter(e=>monthOf(e.date)===m)}
function spentByCategory(cat,m=S.currentMonth){return txInMonth(m).filter(t=>t.kind==='expense'&&t.category===cat).reduce((a,b)=>a+b.amount,0)}
function plannedByCategory(cat,m=S.currentMonth){return S.events.filter(e=>monthOf(e.date)===m&&e.type==='plan'&&e.category===cat&&!e.completed).reduce((a,b)=>a+(b.amount||0),0)}
function ordinaryBudget(){return Object.values(S.budgets).reduce((a,b)=>a+Number(b||0),0)}
function dynamicSpend(){return ['food','gas','tobacco','dining','personal'].reduce((a,k)=>a+Number(S.budgets[k]||0),0)}
function fixedSpend(){return ordinaryBudget()-dynamicSpend()}
function plannedFundAmount(fundId,m=S.currentMonth){return S.events.filter(e=>monthOf(e.date)===m&&e.type==='plan'&&e.fundId===fundId&&!e.completed).reduce((a,b)=>a+(b.amount||0),0)}
function monthlyFundNeed(f){
 if(f.id==='maintenance'){
  const regular=Math.max(0,Math.min(S.settings.maintenanceMonthly,(f.cap??Infinity)-f.balance));
  const plannedNeed=Math.max(0,plannedFundAmount(f.id)-f.balance);
  return Math.max(regular,plannedNeed);
 }
 if(!f.due||f.balance>=f.target)return 0;
 const now=new Date(S.currentMonth+'-01T00:00:00'); const due=new Date(f.due+'T00:00:00');
 let months=(due.getFullYear()-now.getFullYear())*12+(due.getMonth()-now.getMonth())+1; months=Math.max(1,months);
 return Math.ceil((f.target-f.balance)/months);
}
function totalFundNeed(){return S.funds.reduce((a,f)=>a+monthlyFundNeed(f),0)}
function expenseTotal(m=S.currentMonth){return txInMonth(m).filter(t=>t.kind==='expense').reduce((a,b)=>a+b.amount,0)}
function incomeTotal(m=S.currentMonth){return txInMonth(m).filter(t=>t.kind==='income').reduce((a,b)=>a+b.amount,0)}
function reservedTotal(m=S.currentMonth){return S.events.filter(e=>monthOf(e.date)===m&&e.type==='plan'&&!e.completed).reduce((a,b)=>a+(b.amount||0),0)}
function flexibleRemaining(){let total=0;['food','gas','tobacco','dining','personal'].forEach(k=>total+=Math.max(0,S.budgets[k]-spentByCategory(k)-plannedByCategory(k)));return total}
function daysLeft(){const [y,m]=S.currentMonth.split('-').map(Number);const now=new Date();const ref=(now.getFullYear()===y&&now.getMonth()+1===m)?now:new Date(y,m-1,1);const last=new Date(y,m,0).getDate();return Math.max(1,last-ref.getDate()+1)}
function todayAllowance(){const nonDaily=['gas','tobacco'];let rem=0;['food','dining','personal'].forEach(k=>rem+=Math.max(0,S.budgets[k]-spentByCategory(k)-plannedByCategory(k)));return Math.floor(rem/daysLeft())}
function currentSafeStatus(){const rem=flexibleRemaining(), reserved=reservedTotal(), allowance=todayAllowance(); if(rem<0||S.salary < ordinaryBudget()+totalFundNeed()) return ['DANGER','danger']; if(allowance<700||reserved>rem*.7)return ['WATCH','watch']; return ['SAFE','safe']}
function defenseTarget(){return S.defense<100000?100000:S.defense<420000?420000:840000}
function stage(){if(S.defense<100000)return 1;if(S.defense<420000)return 2;if(S.defense<840000)return 3;return 4}
function projectedSaving(){return Math.max(0,S.salary-ordinaryBudget()-totalFundNeed()-S.settings.minReserve)}
function investedUnlocked(){return S.defense>=420000 && S.funds.every(f=>f.balance>=Math.min(f.target,f.cap||f.target)) && projectedSaving()>=0}
function totalAllocated(){return S.defense+S.investment+S.funds.reduce((a,f)=>a+f.balance,0)}
function actualFreeAssets(){return Math.max(0,S.totalAssets-totalAllocated())}
function addSuggestion(id,title,body,action){if(S.suggestions.some(x=>x.id===id))return;S.suggestions.push({id,title,body,action,created:todayISO()})}
function generateSuggestions(){
 if(txInMonth().length>=6){
  ['food','gas','dining','personal'].forEach(k=>{
   const vals=[];
   for(let i=0;i<3;i++){
    const d=new Date(S.currentMonth+'-01T00:00:00');
    d.setMonth(d.getMonth()-i);
    const m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const spent=spentByCategory(k,m);
    if(spent>0) vals.push(spent);
   }
   if(vals.length>=3){
    const avg=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length/100)*100;
    const cur=S.budgets[k];
    if(Math.abs(avg-cur)>=1000){
     addSuggestion('budget-'+k,`${S.categories[k]}予算を見直し`,`直近3か月平均は${yen(avg)}、現在予算は${yen(cur)}です。`,{type:'budget',key:k,value:avg});
    }
   }
  });
 }
 S.funds.forEach(f=>{
  if(f.cap&&f.balance>=f.cap){
   addSuggestion('cap-'+f.id,`${f.name}が上限に到達`,`今月の積立を生活防衛資金へ回すことをおすすめします。`,{type:'skipFund',fundId:f.id});
  }
 });
}

function contributedThisMonth(fundId,m=S.currentMonth){return Number(S.fundContribs?.[m]?.[fundId])||0}
function recordFundContribution(fundId,amount,m=S.currentMonth){S.fundContribs[m]??={};S.fundContribs[m][fundId]=(Number(S.fundContribs[m][fundId])||0)+amount}
function monthlyFundNeed(f){const contributed=contributedThisMonth(f.id),baseBalance=Math.max(0,f.balance-contributed);if(f.id==='maintenance'){const regular=Math.max(0,Math.min(S.settings.maintenanceMonthly,(f.cap??Infinity)-baseBalance));const planned=Math.max(0,plannedFundAmount(f.id)-baseBalance);return Math.max(0,Math.max(regular,planned)-contributed)}if(!f.due||baseBalance>=f.target)return 0;const now=new Date(S.currentMonth+'-01T00:00:00'),due=new Date(f.due+'T00:00:00');let months=(due.getFullYear()-now.getFullYear())*12+(due.getMonth()-now.getMonth())+1;months=Math.max(1,months);const scheduled=Math.ceil((f.target-baseBalance)/months);return Math.max(0,scheduled-contributed)}
function investedUnlocked(){return S.defense>=420000&&totalFundNeed()===0&&projectedSaving()>=0}
function doFundDeposit(id){const f=S.funds.find(x=>x.id===id);if(!f)return;let a=Math.max(0,Math.round(Number(document.querySelector('#fAmt')?.value)||0));if(!a){toast('積立額を入力してください');return}if(f.cap!=null)a=Math.min(a,Math.max(0,f.cap-f.balance));if(!a){toast('積立上限に到達しています');return}f.balance+=a;recordFundContribution(id,a);addHistory('積立',`${f.name} +${yen(a)}`);closeModal();save('積立を反映しました')}


function renderRecordRows(){const txs=txInMonth().sort((a,b)=>(b.date+(b.id||'')).localeCompare(a.date+(a.id||''))),seen=new Set(),rows=[];for(const t of txs){if(t.receiptId){if(seen.has(t.receiptId))continue;seen.add(t.receiptId);const group=txs.filter(x=>x.receiptId===t.receiptId),rec=S.receipts.find(r=>r.id===t.receiptId),total=rec?.total||group.reduce((a,b)=>a+b.amount,0),cats=[...new Set(group.map(x=>S.categories[x.category]||x.category))].join('・'),pm=rec?.paymentMethod||t.paymentMethod||'cash';rows.push(`<div class="listItem"><div><b>🧾 ${escapeHtml(rec?.merchant||t.shop||t.title||'レシート')}</b><div class="meta">${t.date} ・ ${escapeHtml(cats)} ・ ${paymentLabel(pm)}${t.billingDate?' → '+t.billingDate+'引落':''}</div></div><div style="text-align:right"><div class="money neg">-${yen(total)}</div><button class="btn small red" style="margin-top:6px" onclick="deleteReceiptRecord('${t.receiptId}')">記録削除</button></div></div>`)}else rows.push(`<div class="listItem"><div><b>${escapeHtml(t.title||S.categories[t.category]||'支出')}</b><div class="meta">${t.date} ・ ${paymentLabel(t.paymentMethod||'cash')}${t.billingDate?' → '+t.billingDate+'引落':''}${t.note?' ・ '+escapeHtml(t.note):''}</div></div><div style="text-align:right"><div class="money ${t.kind==='income'?'pos':'neg'}">${t.kind==='income'?'+':'-'}${yen(t.amount)}</div><button class="btn small red" style="margin-top:6px" onclick="deleteTransaction('${t.id}')">削除</button></div></div>`)}return rows.slice(0,40)}

function receiptGroups(m=S.currentMonth){
 const map=new Map();
 txInMonth(m).filter(t=>t.receiptId).forEach(t=>{if(!map.has(t.receiptId))map.set(t.receiptId,[]);map.get(t.receiptId).push(t)});
 return map;
}
function deleteTransaction(id){
 const t=S.transactions.find(x=>x.id===id);if(!t)return;
 if(S.monthClosures[monthOf(t.date)]){toast('締め済みの月は削除できません');return}
 if(!confirm(`${t.date} ${t.title||'支出'} ${yen(t.amount)} を削除しますか？`))return;
 S.transactions=S.transactions.filter(x=>x.id!==id);addHistory('支出削除',`${t.date} ${t.title||''} ${yen(t.amount)}`);save('支出を削除しました');
}
function deleteReceiptRecord(receiptId){
 const txs=S.transactions.filter(t=>t.receiptId===receiptId);if(!txs.length)return;
 const m=monthOf(txs[0].date);if(S.monthClosures[m]){toast('締め済みの月は削除できません');return}
 const rec=S.receipts.find(r=>r.id===receiptId);const total=rec?.total||txs.reduce((a,b)=>a+b.amount,0);
 if(!confirm(`このレシート記録 ${yen(total)} を完全に削除しますか？
金額・カテゴリ反映・カレンダー記録もすべて消えます。`))return;
 S.transactions=S.transactions.filter(t=>t.receiptId!==receiptId);S.receipts=S.receipts.filter(r=>r.id!==receiptId);
 addHistory('レシート記録削除',`${txs[0].date} ${rec?.merchant||txs[0].shop||''} ${yen(total)}`);save('レシート記録を完全削除しました');
}
function renderRecordRows(){
 const txs=txInMonth().sort((a,b)=>(b.date+(b.id||'')).localeCompare(a.date+(a.id||'')));
 const seen=new Set(),rows=[];
 for(const t of txs){
  if(t.receiptId){if(seen.has(t.receiptId))continue;seen.add(t.receiptId);const group=txs.filter(x=>x.receiptId===t.receiptId);const rec=S.receipts.find(r=>r.id===t.receiptId);const total=rec?.total||group.reduce((a,b)=>a+b.amount,0);const cats=[...new Set(group.map(x=>S.categories[x.category]||x.category))].join('・');rows.push(`<div class="listItem"><div><b>🧾 ${escapeHtml(rec?.merchant||t.shop||t.title||'レシート')}</b><div class="meta">${t.date} ・ ${escapeHtml(cats)} ・ 画像は保存されません</div></div><div style="text-align:right"><div class="money neg">-${yen(total)}</div><button class="btn small red" style="margin-top:6px" onclick="deleteReceiptRecord('${t.receiptId}')">記録削除</button></div></div>`)}
  else rows.push(`<div class="listItem"><div><b>${escapeHtml(t.title||S.categories[t.category]||'支出')}</b><div class="meta">${t.date} ・ ${escapeHtml(S.categories[t.category]||t.category||'')}${t.note?' ・ '+escapeHtml(t.note):''}</div></div><div style="text-align:right"><div class="money ${t.kind==='income'?'pos':'neg'}">${t.kind==='income'?'+':'-'}${yen(t.amount)}</div><button class="btn small red" style="margin-top:6px" onclick="deleteTransaction('${t.id}')">削除</button></div></div>`)
 }
 return rows.slice(0,30);
}

function renderAssets(){const fundCards=S.funds.map(f=>{const need=monthlyFundNeed(f);const pct=Math.min(100,(f.balance/(f.target||1))*100);return `<div class="card"><div class="budgetItem"><div><div class="label">${f.icon} ${f.name}</div><div class="mid">${yen(f.balance)}</div></div><div class="tiny">目標 ${yen(f.target)}</div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="grid2"><div class="tiny">今月必要 ${yen(need)}</div><div class="tiny">${f.due?'期限 '+f.due:'上限 '+yen(f.cap||f.target)}</div></div><div style="margin-top:10px"><button class="btn small" onclick="fundDeposit('${f.id}')">積立を記録</button> <button class="btn small ghost" onclick="fundUse('${f.id}')">使用を記録</button></div></div>`}).join('');

function renderChart(){const hist=Object.entries(S.monthClosures).sort(([a],[b])=>a.localeCompare(b)).slice(-8);if(!hist.length)return '<div class="empty">月を締めると資産推移が表示されます</div>';const max=Math.max(...hist.map(x=>x[1].totalAssets||1));return `<div class="chart">${hist.map(([m,v])=>`<div class="bar" style="height:${Math.max(8,(v.totalAssets/max)*145)}px"><span>${m.slice(5)}</span></div>`).join('')}</div>`}
function displayTxForDate(di){const txs=S.transactions.filter(t=>t.date===di),seen=new Set(),out=[];for(const t of txs){if(t.receiptId){if(seen.has(t.receiptId))continue;seen.add(t.receiptId);const group=txs.filter(x=>x.receiptId===t.receiptId);const rec=S.receipts.find(r=>r.id===t.receiptId);out.push({type:'exp',title:rec?.merchant||t.shop||'レシート',amount:rec?.total||group.reduce((a,b)=>a+b.amount,0),receiptId:t.receiptId})}else out.push({type:t.kind==='income'?'inc':'exp',title:t.title||S.categories[t.category],amount:t.amount,txId:t.id})}return out}
function renderCalendar(){const y=calDate.getFullYear(),m=calDate.getMonth();const first=new Date(y,m,1),start=(first.getDay()+6)%7;const cells=[];for(let i=0;i<42;i++){const n=i-start+1;const d=new Date(y,m,n);const di=iso(d);const own=d.getMonth()===m;const ev=[...S.events.filter(e=>e.date===di),...displayTxForDate(di)];cells.push(`<div class="day ${own?'':'muted'} ${di===todayISO()?'today':''}" onclick="openDay('${di}')"><div class="n">${d.getDate()}</div>${ev.slice(0,3).map(e=>`<div class="ev ${e.type}">${escapeHtml(e.title)}${e.amount?' '+yen(e.amount):''}</div>`).join('')}</div>`)}document.querySelector('#calendar').innerHTML=`<div class="calendarHead"><button class="btn small" onclick="moveCal(-1)">‹</button><div class="mid">${y}年 ${m+1}月</div><button class="btn small" onclick="moveCal(1)">›</button></div><div class="calendar">${['月','火','水','木','金','土','日'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.join('')}</div>`}

function finishEvent(id){const e=S.events.find(x=>x.id===id),a=Math.max(0,Math.round(Number(realAmt.value)||0));if(!e||!a){toast('実際の金額を入力してください');return}S.transactions.push({id:uid(),date:e.date,amount:a,category:e.category||'other',kind:'expense',title:e.title,note:'予定から実績化',fundId:e.fundId||null});let covered=0;if(e.fundId){const f=S.funds.find(x=>x.id===e.fundId);if(f){covered=Math.min(f.balance,a);f.balance-=covered;if(a>covered)addSuggestion('fund-short-'+e.id,`${f.name}が${yen(a-covered)}不足`,`予定実績 ${yen(a)} に対して積立残高が不足しました。次月の積立額を自動再計算します。`,{type:'noop'});if(f.id==='hospital'){const d=new Date(e.date+'T00:00:00');d.setMonth(d.getMonth()+2);const nd=iso(d);const due=new Date(d.getFullYear(),d.getMonth(),0);f.due=iso(due);S.events.push({id:uid(),date:nd,type:'plan',title:'通院',amount:f.target,category:'other',fundId:'hospital',note:'前回通院から2か月後',completed:false})}}}e.completed=true;e.actualAmount=a;e.fundCovered=covered;addHistory('予定実績化',`${e.title} ${yen(a)}${e.fundId?' / 積立から '+yen(covered):''}`);closeModal();save('実績に反映しました')}

function adjustCoreAsset(key,dir){const label=key==='defense'?'生活防衛資金':'投資資産';const cur=Number(S[key])||0;modal(`<h3>${label}${dir>0?'へ追加':'から使用'}</h3><div class="formGroup"><label>金額</label><input id="coreAmt" class="input" type="number" inputmode="numeric"></div><div class="notice">口座内の全財産は自動で増減しません。ここでは全財産の中の「用途分け」だけを更新します。</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="doAdjustCoreAsset('${key}',${dir})">反映</button></div>`)}
function doAdjustCoreAsset(key,dir){const a=Math.max(0,Math.round(Number(document.querySelector('#coreAmt')?.value)||0));if(!a){toast('金額を入力してください');return}const label=key==='defense'?'生活防衛資金':'投資資産';if(dir<0&&a>S[key]){toast('現在額を超えて使用できません');return}S[key]=Math.max(0,S[key]+a*dir);addHistory(label+(dir>0?'追加':'使用'),`${dir>0?'+':'-'}${yen(a)}`);closeModal();save(`${label}を更新しました`)}
function fundDeposit(id){const f=S.funds.find(x=>x.id===id);modal(`<h3>${f.name}へ積立</h3><div class="formGroup"><label>金額</label><input id="fAmt" class="input" type="number" value="${monthlyFundNeed(f)}"></div><div class="actions"><button class="btn primary" onclick="doFundDeposit('${id}')">反映</button></div>`)}
function doFundDeposit(id){const f=S.funds.find(x=>x.id===id);if(!f)return;let a=Math.max(0,Math.round(Number(fAmt.value)||0));if(!a){toast('積立額を入力してください');return}if(f.cap!=null)a=Math.min(a,Math.max(0,f.cap-f.balance));if(!a){toast('積立上限に到達しています');return}f.balance+=a;addHistory('積立',`${f.name} +${yen(a)}`);closeModal();save('積立を反映しました')}
function fundUse(id){const f=S.funds.find(x=>x.id===id);modal(`<h3>${f.name}から使用</h3><div class="formGroup"><label>使用額</label><input id="fuAmt" class="input" type="number"></div><div class="actions"><button class="btn primary" onclick="doFundUse('${id}')">反映</button></div>`)}
function doFundUse(id){const f=S.funds.find(x=>x.id===id);if(!f)return;const wanted=Math.max(0,Math.round(Number(fuAmt.value)||0));const a=Math.min(wanted,f.balance);if(!a){toast('使用額を入力してください');return}f.balance-=a;if(f.id==='tax'&&f.due){const d=new Date(f.due+'T00:00:00');d.setFullYear(d.getFullYear()+1);f.due=iso(d)}addHistory('積立使用',`${f.name} -${yen(a)}`);closeModal();save('使用額を反映しました')}
function acceptSuggestion(id){const s=S.suggestions.find(x=>x.id===id);if(!s)return;if(s.action?.type==='budget'){const old=S.budgets[s.action.key];S.budgets[s.action.key]=s.action.value;addHistory('AI提案反映',`${S.categories[s.action.key]} ${yen(old)}→${yen(s.action.value)}`)}if(s.action?.type==='skipFund'){S.defense+=S.settings.maintenanceMonthly;addHistory('AI提案反映',`${yen(S.settings.maintenanceMonthly)}を生活防衛資金へ`)}if(s.action?.type==='defenseAdd'){S.defense+=Math.max(0,Number(s.action.value)||0);addHistory('月末余り反映',`生活防衛資金 +${yen(s.action.value)}`)}S.suggestions=S.suggestions.filter(x=>x.id!==id);save('提案を反映しました')}
function dismissSuggestion(id){S.suggestions=S.suggestions.filter(x=>x.id!==id);save()}

function runSim(){const a=Number(simAmt.value)||0;const free=actualFreeAssets();const monthly=Math.max(1,projectedSaving());const delay=Math.ceil(Math.max(0,a-free)/monthly);simOut.innerHTML=`<div class="card"><div class="label">購入後の自由資産</div><div class="mid">${yen(free-a)}</div><div class="tiny">生活防衛資金への直接影響：${a<=free?'なし':'不足分あり'}<br>投資開始予測への影響：${delay?'約'+delay+'か月遅れる可能性':'大きな遅延なし'}</div></div>`}
function nextMonthOf(m){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function openMonthEndUpdate(){
 const next=nextMonthOf(S.currentMonth);
 modal(`<h3>月末更新</h3><div class="notice">${S.currentMonth}を締めて、${next}運用へ切り替えます。<br>給料は「月末に振り込まれた実際の手取り」、口座残高は「その給料が入った後の実際の口座残高」を入力してください。<br><b>給料を口座残高へ二重加算することはありません。</b></div><div class="formGroup" style="margin-top:12px"><label>${next}運用分の給料</label><input class="input" id="meSalary" type="number" value="${S.salary}"></div><div class="formGroup"><label>給料入金後の口座内の全財産</label><input class="input" id="meAssets" type="number" value="${S.totalAssets}"></div><div class="actions"><button class="btn primary" onclick="applyMonthEndUpdate()">締めて次月へ</button><button class="btn ghost" onclick="closeModal()">キャンセル</button></div>`)
}
function applyMonthEndUpdate(){
 const pending=eventsInMonth().filter(e=>e.type==='plan'&&!e.completed);if(pending.length&&!confirm(`今月に未完了の予定が${pending.length}件あります。支出には変換せず、そのまま締めて次月へ進みますか？`))return;
 const next=nextMonthOf(S.currentMonth),newSalary=Math.max(0,Number(document.querySelector('#meSalary')?.value)||0),newAssets=Math.max(0,Number(document.querySelector('#meAssets')?.value)||0);
 if(!newSalary){toast('給料を入力してください');return}
 if(!S.monthClosures[S.currentMonth]){
  const variableBudget=dynamicSpend();
  const varActual=['food','gas','tobacco','dining','personal'].reduce((a,k)=>a+spentByCategory(k),0);
  const saved=Math.max(0,variableBudget-varActual);
  S.monthClosures[S.currentMonth]={date:new Date().toISOString(),salary:S.salary,expense:expenseTotal(),saved,totalAssets:S.totalAssets,defense:S.defense};
  addHistory('月末締め',`${S.currentMonth} 節約 ${yen(saved)}`);if(saved>0)addSuggestion('month-save-'+S.currentMonth,`${S.currentMonth}の節約分を守る`,`${yen(saved)}を生活防衛資金へ移すことを推奨します。`,{type:'defenseAdd',value:saved});
 }
 const oldMonth=S.currentMonth,oldAssets=S.totalAssets;
 S.currentMonth=next;S.salary=newSalary;S.totalAssets=newAssets;calDate=new Date(next+'-01T00:00:00');
 S.balanceChecks.unshift({date:new Date().toISOString(),old:oldAssets,new:newAssets,diff:newAssets-oldAssets,note:`${next}運用開始`});
 addHistory('月末更新',`${oldMonth}→${next} / 給料 ${yen(newSalary)} / 口座 ${yen(newAssets)}`);
 closeModal();save(`${next}の運用を開始しました`)
}
function closeMonth(){if(S.monthClosures[S.currentMonth]){toast('すでに締め済みです');return}const pending=eventsInMonth().filter(e=>e.type==='plan'&&!e.completed);if(pending.length&&!confirm(`未完了の予定が${pending.length}件あります。予定は支出に変換されません。このまま月を締めますか？`))return;const variableBudget=dynamicSpend();const varActual=['food','gas','tobacco','dining','personal'].reduce((a,k)=>a+spentByCategory(k),0);const saved=Math.max(0,variableBudget-varActual);S.monthClosures[S.currentMonth]={date:new Date().toISOString(),salary:S.salary,expense:expenseTotal(),saved,totalAssets:S.totalAssets,defense:S.defense,pendingPlans:pending.length};addHistory('月末締め',`${S.currentMonth} 確定節約 ${yen(saved)}`);if(saved>0)addSuggestion('month-save-'+S.currentMonth,`${S.currentMonth}の節約分を守る`,`${yen(saved)}を生活防衛資金へ移すことを推奨します。`,{type:'defenseAdd',value:saved});save('月末結果を保存しました')}

function restore(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result);if(!raw||typeof raw!=='object'||!raw.budgets||!Array.isArray(raw.transactions))throw new Error('invalid');localStorage.setItem('miraiflow',JSON.stringify(raw));S=load();calDate=new Date(S.currentMonth+'-01T00:00:00');save('復元しました');}catch(e){alert('MIRAIFLOWのバックアップとして読み込めないファイルです')}};r.readAsText(inp.files[0])};inp.click()}

async function resizeReceipt(dataUrl,maxSide=1800,quality=.84){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const scale=Math.min(1,maxSide/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=dataUrl})}
function receiptManualModal(dataUrl,message='Gemini AI未接続のため確認入力します。'){modal(`<h3>レシート登録</h3><img class="receiptPreview" src="${dataUrl}"><div class="notice" style="margin-top:10px">${message}</div><div class="formGroup" style="margin-top:12px"><label>購入日</label><input id="rDate" class="input" type="date" value="${todayISO()}"></div><div class="formGroup"><label>合計金額</label><input id="rAmt" class="input" type="number"></div><div class="formGroup"><label>主カテゴリ</label><select id="rCat" class="input">${Object.entries(S.categories).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="formGroup"><label>店舗名</label><input id="rShop" class="input"></div><div class="actions"><button class="btn primary" onclick="saveReceiptManual()">確認して登録</button><button class="btn ghost" onclick="cancelReceipt()">破棄して閉じる</button></div><div class="tiny" style="margin-top:8px">登録後、写真データは自動破棄されます。</div>`);window.__receiptData=dataUrl}
async function receiptPicked(file){if(!file)return;const r=new FileReader();r.onload=async()=>{let dataUrl=r.result;try{dataUrl=await resizeReceipt(dataUrl)}catch(e){}window.__receiptData=dataUrl;const api=(S.settings.receiptApiUrl||'').trim();if(!api){receiptManualModal(dataUrl);return}modal(`<h3>レシートAI解析</h3><img class="receiptPreview" src="${dataUrl}"><div class="notice" style="margin-top:10px"><span class="spinner"></span>Geminiが店舗・商品・金額を読み取っています…</div>`);try{const result=await analyzeReceipt(dataUrl);showReceiptReview(result,dataUrl)}catch(e){console.error(e);receiptManualModal(dataUrl,`AI解析に失敗しました。手入力へ切り替えます。<br><span class="tiny">${escapeHtml(e.message||'通信エラー')}</span>`)}};r.readAsDataURL(file)}
document.querySelector('#receiptFile').onchange=e=>{receiptPicked(e.target.files[0]);e.target.value=''};
async function analyzeReceipt(dataUrl){const base=(S.settings.receiptApiUrl||'').trim().replace(/\/$/,'');const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),45000);try{const res=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'receipt',image:dataUrl}),signal:ctrl.signal});let json={};try{json=await res.json()}catch(e){}if(!res.ok)throw new Error(json.error||`APIエラー ${res.status}`);if(!json.receipt)throw new Error('解析結果がありません');return json.receipt}finally{clearTimeout(timer)}}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function validCat(c){return Object.prototype.hasOwnProperty.call(S.categories,c)?c:'other'}
function showReceiptReview(r,dataUrl){const items=(r.items||[]).map((it,i)=>({name:it.name||`商品${i+1}`,amount:Math.max(0,Math.round(Number(it.amount)||0)),category:validCat(it.category),confidence:Number(it.confidence)||0}));window.__receiptAI={merchant:r.merchant||'',date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:todayISO(),total:Math.max(0,Math.round(Number(r.total)||0)),items};window.__receiptData=dataUrl;const itemHtml=items.length?items.map((it,i)=>`<div class="receiptItem"><div><div class="name">${escapeHtml(it.name)}</div><div class="amt"><input class="input" style="padding:8px;margin-top:6px" id="riAmt${i}" type="number" value="${it.amount}"></div></div><select id="riCat${i}" class="input">${Object.entries(S.categories).map(([k,v])=>`<option value="${k}" ${k===it.category?'selected':''}>${v}</option>`).join('')}</select></div>`).join(''):'<div class="empty">商品明細を読み取れませんでした。合計を「その他」で登録できます。</div>';modal(`<h3>Gemini解析結果を確認</h3><img class="receiptPreview" src="${dataUrl}"><div class="notice" style="margin-top:10px">Geminiの結果は確定前に必ず確認してください。カテゴリは商品ごとに変更できます。</div><div class="formGroup" style="margin-top:12px"><label>店舗名</label><input id="rShop" class="input" value="${escapeHtml(window.__receiptAI.merchant)}"></div><div class="grid2"><div class="formGroup"><label>購入日</label><input id="rDate" class="input" type="date" value="${window.__receiptAI.date}"></div><div class="formGroup"><label>レシート合計</label><input id="rAmt" class="input" type="number" value="${window.__receiptAI.total}"></div></div><div class="label">商品別分類</div><div class="receiptItems">${itemHtml}</div><div class="actions"><button class="btn primary" onclick="saveReceiptAI()">この内容で登録</button><button class="btn" onclick="receiptManualModal(window.__receiptData,'手入力へ切り替えました。')">手入力へ</button><button class="btn ghost" onclick="cancelReceipt()">破棄</button></div><div class="tiny" style="margin-top:8px">登録完了後、画像は自動的にメモリから破棄され、保存されません。</div>`)}
function cancelReceipt(){clearReceiptTemp();closeModal();toast('レシート写真を破棄しました')}
function duplicateReceipt(date,total,shop){const ids=new Set(S.transactions.filter(t=>t.receiptTotal===total&&t.date===date&&(t.shop||'')===(shop||'')).map(t=>t.receiptId).filter(Boolean));return ids.size>0}
function saveReceiptAI(){const r=window.__receiptAI||{};const shop=(document.querySelector('#rShop')?.value||'').trim();const date=document.querySelector('#rDate')?.value||todayISO();const total=Math.max(0,Math.round(Number(document.querySelector('#rAmt')?.value)||0));if(!total){toast('合計金額を確認してください');return}if(duplicateReceipt(date,total,shop)&&!confirm('同じ日付・金額・店舗のレシートが登録済みです。重複して登録しますか？'))return;let items=(r.items||[]).map((it,i)=>({name:it.name||'商品',amount:Math.max(0,Math.round(Number(document.querySelector(`#riAmt${i}`)?.value)||0)),category:validCat(document.querySelector(`#riCat${i}`)?.value||it.category)})).filter(x=>x.amount>0);const sum=items.reduce((a,b)=>a+b.amount,0);if(!items.length)items=[{name:'レシート合計',amount:total,category:'other'}];else if(sum!==total){const diff=total-sum;if(Math.abs(diff)>Math.max(10,total*.05)&&!confirm(`商品合計 ${yen(sum)} とレシート合計 ${yen(total)} に ${yen(Math.abs(diff))} の差があります。差額を「その他」として登録しますか？`))return;if(diff>0)items.push({name:'税・値引き等の差額',amount:diff,category:'other'});if(diff<0){toast('商品合計がレシート合計を上回っています。金額を確認してください');return}}const receiptId=uid();const grouped={};for(const it of items)grouped[it.category]=(grouped[it.category]||0)+it.amount;S.receipts.push({id:receiptId,date,merchant:shop,total,items:deep(items),source:'gemini',createdAt:new Date().toISOString()});Object.entries(grouped).forEach(([category,amount])=>S.transactions.push({id:uid(),date,amount,category,kind:'expense',title:shop||'レシート',shop,receiptId,receiptTotal:total,note:'Geminiレシート分類'}));addHistory('Geminiレシート登録',`${date} ${shop||'店舗不明'} ${yen(total)} / ${Object.keys(grouped).length}カテゴリ / 画像破棄済み`);clearReceiptTemp();closeModal();save('レシートを分類登録し、写真を自動破棄しました')}
function saveReceiptManual(){const a=Math.max(0,Math.round(Number(document.querySelector('#rAmt')?.value)||0));const date=document.querySelector('#rDate')?.value||todayISO();const shop=(document.querySelector('#rShop')?.value||'').trim();const cat=validCat(document.querySelector('#rCat')?.value);if(!a){toast('金額を入力してください');return}if(duplicateReceipt(date,a,shop)&&!confirm('同じ日付・金額・店舗のレシートが登録済みです。登録しますか？'))return;const receiptId=uid();S.receipts.push({id:receiptId,date,merchant:shop,total:a,items:[{name:'レシート合計',amount:a,category:cat}],source:'manual',createdAt:new Date().toISOString()});S.transactions.push({id:uid(),date,amount:a,category:cat,kind:'expense',title:shop||S.categories[cat],shop,receiptId,receiptTotal:a,note:'レシート手入力'});addHistory('レシート登録',`${date} ${shop} ${yen(a)} / 画像破棄済み`);clearReceiptTemp();closeModal();save('レシート支出を登録し、写真を自動破棄しました')}
function editReceiptApi(){modal(`<h3>レシートAI（Gemini）接続</h3><div class="notice">Supabase Edge FunctionのURLだけを入力します。Gemini APIキーはここには入力しません。</div><div class="formGroup" style="margin-top:12px"><label>Edge Function URL</label><input class="input" id="apiUrl" inputmode="url" placeholder="https://YOUR_PROJECT.supabase.co/functions/v1/miraiflow-receipt" value="${escapeHtml(S.settings.receiptApiUrl||'')}"></div><div class="actions"><button class="btn primary" onclick="saveReceiptApi()">保存してテスト</button><button class="btn ghost" onclick="closeModal()">キャンセル</button></div>`)}

async function testReceiptApi(){const base=(S.settings.receiptApiUrl||'').trim().replace(/\/$/,'');if(!base){toast('Edge Function URLが未設定です');return}modal(`<h3>接続テスト</h3><div class="notice"><span class="spinner"></span>Supabaseへ接続しています…</div>`);try{const res=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'health'}),cache:'no-store'});let j={};try{j=await res.json()}catch(e){}if(!res.ok||!j.ok)throw new Error(j.error||'接続できません');modal(`<h3>接続OK</h3><div class="notice">GeminiレシートAIを利用できます。<br><span class="tiny">モデル: ${escapeHtml(j.model||'configured')} / Supabase</span></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="closeModal()">閉じる</button></div>`)}catch(e){modal(`<h3>接続できません</h3><div class="notice" style="border-color:#6d2b38;color:#ffc5cb">${escapeHtml(e.message||'通信エラー')}</div><div class="tiny" style="margin-top:10px">Edge Function URL、公開設定、ALLOWED_ORIGINS、GEMINI_API_KEYを確認してください。</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="editReceiptApi()">設定を確認</button></div>`)}}

// ===== v3.4 Cashflow / Card / Fixed cost / Auto allocation =====
const PAY_METHODS={cash:'現金',rakutenCard:'楽天カード',auCard:'au PAYカード',jcbCard:'JCB',bank:'口座引落'};
const CARD_KEYS=['rakutenCard','auCard','jcbCard'];
const FIXED_META={
 father:'父へ',carLoan:'車ローン',aflac:'Aflac',carInsurance:'車保険',rakuten:'楽天モバイル',youtube:'YouTube Premium',chatgpt:'ChatGPT Plus'
};
function upgradeV34(){
 S.version=3.4;
 S.cardOpeningBills=Array.isArray(S.cardOpeningBills)?S.cardOpeningBills:[];
 S.cardSettlements=S.cardSettlements&&typeof S.cardSettlements==='object'?S.cardSettlements:{};
 S.fixedPayments=Array.isArray(S.fixedPayments)?S.fixedPayments:[];
 S.fundContribs=S.fundContribs&&typeof S.fundContribs==='object'?S.fundContribs:{};
 S.fixedConfig=S.fixedConfig&&typeof S.fixedConfig==='object'?S.fixedConfig:{};
 const defaults={father:{day:null,paymentMethod:'bank'},carLoan:{day:null,paymentMethod:'bank'},aflac:{day:null,paymentMethod:'bank'},carInsurance:{day:null,paymentMethod:'auCard'},rakuten:{day:null,paymentMethod:'jcbCard'},youtube:{day:null,paymentMethod:'auCard'},chatgpt:{day:null,paymentMethod:'auCard'}};
 Object.keys(FIXED_META).forEach(k=>S.fixedConfig[k]={...defaults[k],...(S.fixedConfig[k]||{})});
 S.settings={...S.settings,autoAllocation:S.settings?.autoAllocation!==false};
 S.transactions.forEach(t=>{if(t.kind==='expense'&&!t.paymentMethod)t.paymentMethod='cash';if(CARD_KEYS.includes(t.paymentMethod)&&!t.billingDate)t.billingDate=cardBillingDate(t.paymentMethod,t.date)});
 localStorage.setItem('miraiflow',JSON.stringify(S));
}
function paymentLabel(k){return PAY_METHODS[k]||'現金'}
function dateWithDay(month,day){if(!day)return null;const [y,m]=month.split('-').map(Number);const last=new Date(y,m,0).getDate();return `${y}-${String(m).padStart(2,'0')}-${String(Math.min(Math.max(1,day),last)).padStart(2,'0')}`}
function cardBillingDate(card,date){
 const d=new Date(date+'T00:00:00');const day=d.getDate();let closeMonth=new Date(d.getFullYear(),d.getMonth(),1);let payDay=1;
 if(card==='auCard'){if(day>10)closeMonth.setMonth(closeMonth.getMonth()+1);payDay=4}
 else if(card==='jcbCard'){if(day>15)closeMonth.setMonth(closeMonth.getMonth()+1);payDay=10}
 else if(card==='rakutenCard'){payDay=27}
 else return null;
 closeMonth.setMonth(closeMonth.getMonth()+1);return `${closeMonth.getFullYear()}-${String(closeMonth.getMonth()+1).padStart(2,'0')}-${String(payDay).padStart(2,'0')}`
}
function cardBillKey(card,date){return `${card}|${date}`}
function derivedCardBills(){
 const map={};
 S.transactions.filter(t=>t.kind==='expense'&&CARD_KEYS.includes(t.paymentMethod)).forEach(t=>{const date=t.billingDate||cardBillingDate(t.paymentMethod,t.date);if(!date)return;const k=cardBillKey(t.paymentMethod,date);map[k]??={key:k,card:t.paymentMethod,date,amount:0,source:'usage'};map[k].amount+=Number(t.amount)||0});
 S.cardOpeningBills.forEach(b=>{const k=cardBillKey(b.card,b.date);map[k]??={key:k,card:b.card,date:b.date,amount:0,source:'opening'};map[k].amount+=Number(b.amount)||0;map[k].source=map[k].source==='usage'?'mixed':'opening'});
 return Object.values(map).map(b=>{const st=S.cardSettlements[b.key]||{};return {...b,paid:!!st.paid,actualAmount:st.actualAmount??b.amount,paidAt:st.paidAt||null}}).sort((a,b)=>a.date.localeCompare(b.date));
}
function fixedDueItems(month=S.currentMonth){return Object.entries(S.fixedConfig).flatMap(([key,c])=>{const date=dateWithDay(month,Number(c.day)||0);if(!date)return[];const id=`${month}|${key}`;const paid=S.fixedPayments.find(x=>x.id===id);return[{id,key,title:FIXED_META[key],date,amount:Number(S.budgets[key])||0,paymentMethod:c.paymentMethod||'bank',paid:!!paid,actualAmount:paid?.amount??null}]})}
function cashflowForDate(date){
 const arr=[];
 derivedCardBills().filter(b=>b.date===date).forEach(b=>arr.push({type:b.paid?'inc':'exp',subtype:'cardBill',id:b.key,card:b.card,title:`${paymentLabel(b.card)}引落${b.paid?'済':''}`,amount:b.paid?b.actualAmount:b.amount,paid:b.paid}));
 fixedDueItems(date.slice(0,7)).filter(x=>x.date===date).forEach(f=>arr.push({type:f.paid?'inc':'exp',subtype:'fixed',id:f.id,title:`${f.title}${f.paid?' 支払済':''}`,amount:f.paid?f.actualAmount:f.amount,paid:f.paid}));
 return arr;
}
function upcomingCashflow(limit=3){const today=todayISO();const cards=derivedCardBills().filter(x=>x.date>=today&&!x.paid).map(x=>({...x,title:`${paymentLabel(x.card)}引落`,type:'exp'}));const fixed=[];for(let i=0;i<2;i++){const d=new Date(S.currentMonth+'-01T00:00:00');d.setMonth(d.getMonth()+i);const m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;fixed.push(...fixedDueItems(m).filter(x=>x.date>=today&&!x.paid).map(x=>({...x,title:x.title,type:'exp'})))}return[...cards,...fixed].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,limit)}
function cardOutstanding(){return derivedCardBills().filter(b=>!b.paid).reduce((a,b)=>a+b.amount,0)}
function cashOutThisMonth(){return derivedCardBills().filter(b=>monthOf(b.date)===S.currentMonth&&!b.paid).reduce((a,b)=>a+b.amount,0)+fixedDueItems().filter(f=>!f.paid&&f.paymentMethod==='bank').reduce((a,b)=>a+b.amount,0)}
function paymentSelect(id,selected='cash',includeBank=false){return `<select class="input" id="${id}">${Object.entries(PAY_METHODS).filter(([k])=>includeBank||k!=='bank').map(([k,v])=>`<option value="${k}" ${k===selected?'selected':''}>${v}</option>`).join('')}</select>`}
function recordExpenseWithPayment({date,amount,category,title,note='',paymentMethod='cash',receiptId=null,receiptTotal=null,shop=''}){const t={id:uid(),date,amount,category,kind:'expense',title,note,paymentMethod,receiptId,receiptTotal,shop};if(CARD_KEYS.includes(paymentMethod))t.billingDate=cardBillingDate(paymentMethod,date);S.transactions.push(t);return t}

function renderHome(){generateSuggestions();const [st,cls]=currentSafeStatus();const target=defenseTarget();const pct=Math.min(100,S.defense/target*100);const use=flexibleRemaining();const nextCash=upcomingCashflow(3);const catCards=['food','dining','personal','gas'].map(k=>{const left=S.budgets[k]-spentByCategory(k)-plannedByCategory(k);return `<div class="mini budgetItem"><div><small>${S.categories[k]}</small><div><b>${yen(left)}</b></div></div><div class="tiny">${yen(spentByCategory(k))} / ${yen(S.budgets[k])}</div></div>`}).join('');document.querySelector('#home').innerHTML=`
 <div class="card hero"><div class="label">口座内の全財産</div><div class="big">${yen(S.totalAssets)}</div><div class="grid2"><div class="mini"><div class="label">確保済み</div><div class="value">${yen(totalAllocated())}</div></div><div class="mini"><div class="label">本当に自由な資産</div><div class="value">${yen(actualFreeAssets())}</div></div></div></div>
 <div class="grid2"><div class="card"><div class="label">今月あと使える</div><div class="mid">${yen(use)}</div><div class="tiny">予約済 ${yen(reservedTotal())}</div></div><div class="card"><div class="label">今日の使用目安</div><div class="mid">${yen(todayAllowance())}</div><span class="badge ${cls}">${st}</span></div></div>

 <div class="card"><div class="budgetItem"><div><div class="label">STAGE ${stage()} 生活防衛資金</div><div class="mid">${yen(S.defense)} <span class="tiny">/ ${yen(target)}</span></div></div><div class="tiny">投資開始ライン ${yen(420000)}</div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="tiny">42万円未満は投資0%。積立不足→防衛資金→投資の順で月末自動振り分け。</div></div>

function renderCalendar(){const y=calDate.getFullYear(),m=calDate.getMonth();const first=new Date(y,m,1),start=(first.getDay()+6)%7;const cells=[];for(let i=0;i<42;i++){const n=i-start+1;const d=new Date(y,m,n);const di=iso(d);const own=d.getMonth()===m;const ev=[...S.events.filter(e=>e.date===di),...displayTxForDate(di),...cashflowForDate(di)];cells.push(`<div class="day ${own?'':'muted'} ${di===todayISO()?'today':''}" onclick="openDay('${di}')"><div class="n">${d.getDate()}</div>${ev.slice(0,4).map(e=>`<div class="ev ${e.type}">${escapeHtml(e.title)}${e.amount?' '+yen(e.amount):''}</div>`).join('')}</div>`)}document.querySelector('#calendar').innerHTML=`<div class="calendarHead"><button class="btn small" onclick="moveCal(-1)">‹</button><div class="mid">${y}年 ${m+1}月</div><button class="btn small" onclick="moveCal(1)">›</button></div><div class="notice" style="margin-bottom:10px">カード引落・固定費・支出・予定を同じカレンダーで確認できます。</div><div class="calendar">${['月','火','水','木','金','土','日'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.join('')}</div>`}

function renderSettings(){const aiReady=!!(S.settings.receiptApiUrl||'').trim();const fixedRows=Object.entries(S.fixedConfig).map(([k,c])=>`<div class="settingRow"><div><b>${FIXED_META[k]}</b><div class="tiny">予算 ${yen(S.budgets[k])} ・ ${c.day?`毎月${c.day}日`:'日付未設定'} ・ ${paymentLabel(c.paymentMethod)}</div></div><button class="btn small" onclick="editFixedConfig('${k}')">設定</button></div>`).join('');document.querySelector('#settings').innerHTML=`<div class="sectionTitle"><h2>設定</h2><span>キャッシュフロー管理</span></div>
 <div class="card"><div class="settingRow"><div><b>運用月</b><div class="tiny">月末給料→翌月運用</div></div><b>${S.currentMonth}</b></div><div class="settingRow"><div><b>給料</b></div><button class="btn small" onclick="editSalary()">${yen(S.salary)}</button></div><div class="settingRow"><div><b>月末更新</b><div class="tiny">積立→貯金→投資を自動振り分け</div></div><button class="btn small primary" onclick="openMonthEndUpdate()">実行</button></div><div class="settingRow"><div><b>月間予算</b></div><button class="btn small" onclick="editBudgets()">編集</button></div></div>
 <div class="sectionTitle"><h2>カード</h2><span>締め日から引落日を自動計算</span></div><div class="card"><div class="settingRow"><div><b>au PAYカード</b><div class="tiny">10日締め → 翌月4日</div></div></div><div class="settingRow"><div><b>楽天カード</b><div class="tiny">月末締め → 翌月27日（通常利用）</div></div></div><div class="settingRow"><div><b>JCB</b><div class="tiny">15日締め → 翌月10日</div></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="openOpeningBill()">過去分の請求を追加</button><button class="btn" onclick="showCardBills()">請求一覧</button></div></div>

function editFixedConfig(key){const c=S.fixedConfig[key];modal(`<h3>${FIXED_META[key]}の支払設定</h3><div class="formGroup"><label>毎月の支払日（1〜31）</label><input class="input" id="fixDay" type="number" min="1" max="31" value="${c.day||''}" placeholder="例 25"></div><div class="formGroup"><label>支払方法</label>${paymentSelect('fixPay',c.paymentMethod,true)}</div><div class="notice">カード払いを選ぶと、固定費の支払実績を登録した日にカード利用として記録され、カードの引落日に自動集計されます。</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveFixedConfig('${key}')">保存</button></div>`)}
function saveFixedConfig(key){const day=Math.max(0,Math.min(31,Number(document.querySelector('#fixDay')?.value)||0));S.fixedConfig[key]={...S.fixedConfig[key],day:day||null,paymentMethod:document.querySelector('#fixPay')?.value||'bank'};addHistory('固定費設定',`${FIXED_META[key]} ${day?day+'日':'日付なし'} / ${paymentLabel(S.fixedConfig[key].paymentMethod)}`);closeModal();save('固定費設定を更新しました')}
function openOpeningBill(){modal(`<h3>運用開始前のカード請求を追加</h3><div class="notice">9月運用開始時など、MIRAIFLOW登録前に使ったカードの請求額を入れます。家計予算には再計上せず、口座引落予定だけに反映します。</div><div class="formGroup" style="margin-top:12px"><label>カード</label><select class="input" id="obCard"><option value="auCard">au PAYカード</option><option value="rakutenCard">楽天カード</option><option value="jcbCard">JCB</option></select></div><div class="formGroup"><label>引落日</label><input class="input" id="obDate" type="date" value="${S.currentMonth}-04"></div><div class="formGroup"><label>請求額</label><input class="input" id="obAmt" type="number"></div><div class="actions"><button class="btn primary" onclick="saveOpeningBill()">追加</button></div>`)}
function saveOpeningBill(){const card=document.querySelector('#obCard')?.value,date=document.querySelector('#obDate')?.value,amount=Math.max(0,Number(document.querySelector('#obAmt')?.value)||0);if(!CARD_KEYS.includes(card)||!date||!amount){toast('カード・日付・金額を入力してください');return}S.cardOpeningBills.push({id:uid(),card,date,amount,note:'運用開始前利用分'});addHistory('カード初期請求',`${paymentLabel(card)} ${date} ${yen(amount)}`);closeModal();save('過去分のカード請求を追加しました')}
function showCardBills(){const bills=derivedCardBills();modal(`<h3>カード請求一覧</h3><div class="list">${bills.length?bills.map(b=>`<div class="listItem"><div><b>${paymentLabel(b.card)}</b><div class="meta">${b.date} ${b.paid?'・引落済':'・引落予定'}</div></div><div style="text-align:right"><div class="money ${b.paid?'pos':'neg'}">${yen(b.paid?b.actualAmount:b.amount)}</div>${!b.paid?`<button class="btn small" onclick="confirmCardBill('${b.key}')">引落実績</button>`:''}</div></div>`).join(''):'<div class="empty">請求はありません</div>'}</div>`)}
function confirmCardBill(key){const b=derivedCardBills().find(x=>x.key===key);if(!b)return;modal(`<h3>${paymentLabel(b.card)} 引落実績</h3><div class="formGroup"><label>実際の引落額</label><input class="input" id="cbActual" type="number" value="${b.amount}"></div><div class="tiny">確定すると口座内の全財産から減額します。購入予算は利用日に計上済みなので二重計上しません。</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="payCardBill('${key}')">引落済みにする</button></div>`)}
function payCardBill(key){const b=derivedCardBills().find(x=>x.key===key);if(!b||b.paid)return;const a=Math.max(0,Number(document.querySelector('#cbActual')?.value)||0);if(!a){toast('引落額を入力してください');return}S.cardSettlements[key]={paid:true,actualAmount:a,paidAt:new Date().toISOString()};S.totalAssets=Math.max(0,S.totalAssets-a);addHistory('カード引落',`${paymentLabel(b.card)} ${b.date} -${yen(a)}`);closeModal();save('カード引落を口座残高へ反映しました')}
function confirmFixedPayment(id){const f=fixedDueItems(id.slice(0,7)).find(x=>x.id===id);if(!f)return;modal(`<h3>${f.title} 支払実績</h3><div class="formGroup"><label>実際の支払額</label><input class="input" id="fpAmt" type="number" value="${f.amount}"></div><div class="formGroup"><label>支払方法</label>${paymentSelect('fpMethod',f.paymentMethod,true)}</div><div class="actions"><button class="btn primary" onclick="payFixed('${id}')">支払済みにする</button></div>`)}
function payFixed(id){const month=id.slice(0,7),f=fixedDueItems(month).find(x=>x.id===id);if(!f||f.paid)return;const amount=Math.max(0,Number(document.querySelector('#fpAmt')?.value)||0),pm=document.querySelector('#fpMethod')?.value||f.paymentMethod;if(!amount){toast('支払額を入力してください');return}S.fixedPayments.push({id,key:f.key,date:f.date,amount,paymentMethod:pm,createdAt:new Date().toISOString()});if(pm==='bank')S.totalAssets=Math.max(0,S.totalAssets-amount);recordExpenseWithPayment({date:f.date,amount,category:'other',title:f.title,note:'固定費支払実績',paymentMethod:pm});addHistory('固定費支払',`${f.title} ${yen(amount)} / ${paymentLabel(pm)}`);closeModal();save('固定費の支払実績を反映しました')}

function openExpense(date=todayISO()){modal(`<h3>支出を追加</h3><div class="formGroup"><label>日付</label><input class="input" id="xDate" type="date" value="${date}"></div><div class="formGroup"><label>金額</label><input class="input" id="xAmount" type="number" inputmode="numeric" placeholder="0"></div><div class="formGroup"><label>用途</label><select class="input" id="xCat">${Object.entries(S.categories).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="formGroup"><label>支払方法</label>${paymentSelect('xPay','cash')}</div><div class="formGroup"><label>メモ（任意）</label><input class="input" id="xNote" placeholder="例：スーパー"></div><div class="actions"><button class="btn primary" onclick="saveExpense()">登録</button><button class="btn ghost" onclick="closeModal()">キャンセル</button></div>`)}
function saveExpense(){const amount=Number(document.querySelector('#xAmount')?.value)||0;if(!amount)return;const pm=document.querySelector('#xPay')?.value||'cash',date=document.querySelector('#xDate')?.value||todayISO(),cat=document.querySelector('#xCat')?.value||'other',note=document.querySelector('#xNote')?.value||'';const t=recordExpenseWithPayment({date,amount,category:cat,title:note||S.categories[cat],note,paymentMethod:pm});addHistory('支出登録',`${date} ${S.categories[cat]} ${yen(amount)} / ${paymentLabel(pm)}${t.billingDate?' → '+t.billingDate+'引落':''}`);closeModal();save('支出を登録しました')}

function receiptManualModal(dataUrl,message='Gemini AI未接続のため確認入力します。'){modal(`<h3>レシート登録</h3><img class="receiptPreview" src="${dataUrl}"><div class="notice" style="margin-top:10px">${message}</div><div class="formGroup" style="margin-top:12px"><label>購入日</label><input id="rDate" class="input" type="date" value="${todayISO()}"></div><div class="formGroup"><label>合計金額</label><input id="rAmt" class="input" type="number"></div><div class="formGroup"><label>主カテゴリ</label><select id="rCat" class="input">${Object.entries(S.categories).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="formGroup"><label>支払方法</label>${paymentSelect('rPay','cash')}</div><div class="formGroup"><label>店舗名</label><input id="rShop" class="input"></div><div class="actions"><button class="btn primary" onclick="saveReceiptManual()">確認して登録</button><button class="btn ghost" onclick="cancelReceipt()">破棄して閉じる</button></div><div class="tiny" style="margin-top:8px">登録後、写真データは自動破棄されます。</div>`);window.__receiptData=dataUrl}
